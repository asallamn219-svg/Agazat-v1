<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#1d2b26;--mu:#66756e;--pr:#2f7d62;--pr2:#e1f1ea;--wa:#b7791f;--wb:#fdf3de;--er:#b83a3a;--eb:#fbe5e5;--bd:#dbe4df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b18;--card:#1d2723;--tx:#e8f0ec;--mu:#9bb0a7;--pr:#5cc29e;--pr2:#23372f;--wa:#e5b455;--wb:#3a3122;--er:#ee8a8a;--eb:#3c2525;--bd:#2f3d37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b18;--card:#1d2723;--tx:#e8f0ec;--mu:#9bb0a7;--pr:#5cc29e;--pr2:#23372f;--wa:#e5b455;--wb:#3a3122;--er:#ee8a8a;--eb:#3c2525;--bd:#2f3d37;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6;padding-bottom:78px}
header{padding:18px 16px 6px}
h1{margin:0;font-size:20px}
.sub{color:var(--mu);font-size:14px}
main{padding:8px 14px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.card h2{margin:0 0 8px;font-size:17px}
.al{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.al.w{background:var(--wb);color:var(--wa)}.al.e{background:var(--eb);color:var(--er)}.al.o{background:var(--pr2);color:var(--pr)}
label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:var(--pr2);color:var(--pr)}button.d{background:var(--eb);color:var(--er)}
.add{width:100%;margin-top:12px}
.it{border-top:1px solid var(--bd);padding:10px 0}.it:first-child{border-top:0}
.it b{font-size:16px}.it small{display:block;color:var(--mu)}
.it .bt{display:flex;gap:8px;margin-top:6px}.it .bt button{padding:6px 12px;font-size:14px}
.done{opacity:.55}
.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:20px;padding:0 10px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:9px 2px;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}
nav span{display:block;font-size:20px}
.chk{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.chk input{width:22px;height:22px}
.big{font-size:30px;font-weight:700;color:var(--pr)}
.empty{color:var(--mu);text-align:center;padding:12px}
#sh table{width:100%;border-collapse:collapse;margin-top:14px}#sh td,#sh th{border:1.3px solid #000;padding:8px 6px;text-align:center;font-size:14px;font-weight:600;color:#000}#sh th{font-weight:800}#sh{-webkit-print-color-adjust:exact;print-color-adjust:exact;text-rendering:geometricPrecision}#sh{font-family:inherit}
#sh table.tm td,#sh table.tm th{padding:1px 4px!important;line-height:1.25;font-size:13.5px!important;font-weight:600}#sh table.tm th{font-weight:800}@page{size:A4 portrait;margin:5mm}@page cadp{size:A4 landscape;margin:5mm}.pg.cad{page:cadp}.pg.cad .fr{min-height:196mm}
.np{position:sticky;top:0;background:#fff;padding:8px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}.pg{width:210mm;min-height:297mm;box-sizing:border-box;padding:5mm;background:#fff;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.45)}.fr{border:2px solid #000;padding:7px;min-height:285mm;display:flex;flex-direction:column}@media print{body>*:not(#sh){display:none!important}body{padding:0!important;background:#fff!important}.np{display:none}#sh{position:static!important;padding:0!important;background:#fff!important}#zw{width:auto!important;height:auto!important;overflow:visible!important}#zi{position:static!important;transform:none!important;width:auto!important}.pg{width:auto!important;min-height:0!important;margin:0!important;padding:0!important;box-shadow:none!important}.fr{min-height:285mm!important}#sh table:not(.fx) td,#sh table:not(.fx) th{padding:4px 4px!important;font-size:14.5px!important;font-weight:600}#sh table:not(.fx) th{font-weight:800}#sh img{height:70px!important}#sh,#sh *{color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#sh table.tm td,#sh table.tm th{font-weight:600!important}#sh table.tm th{font-weight:800!important}.pg.cad .fr{min-height:196mm!important}}

.dtb{display:flex;gap:5px;direction:rtl;width:100%;max-width:100%;min-width:0}
.dtb .db{flex:1;min-width:0;width:0;padding:8px 2px;text-align:center;font-size:15px;border-radius:9px;direction:ltr}
.dtb .db:focus{outline:2px solid var(--pr);outline-offset:0;border-color:var(--pr)}
.dtb .db.bad{border-color:var(--er);background:var(--eb)}
.vrr{border-top:1px solid var(--bd);padding:8px 0}.vrr:first-child{border-top:0}
.vrg{margin:12px 0 2px;font-weight:700}
.vrr small{display:block;color:var(--mu)}

.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;background:var(--card);color:var(--mu);border:1px solid var(--bd);padding:10px 4px;border-radius:12px;font-size:15px;font-weight:700}
.seg button small{display:block;font-weight:400;font-size:11px;margin-top:2px}
.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}

/* ===== تحسين الشكل: هادي ومنظم ومريح للعين ===== */
:root{--bg:#f3f6f4;--bd:#e0e8e3;--mu:#5f6f68;--sh:0 1px 3px rgba(31,60,48,.07)}
body{font-size:16.5px;line-height:1.7}
header{padding:20px 18px 8px;max-width:720px;margin:auto}
h1{font-size:21px;letter-spacing:0}
main{padding:6px 14px 14px}
.card{border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--sh)}

ما قبل القانون، والمرحَّل من كل سنة من الثلاث السابقة، والمستحق عن السنة الحالية. تُستنزل الإجازات المأخوذة بالترتيب: المستحقة عن السنة الحالية أولًا، ثم المرحَّلة من الأقدم للأحدث، ثم المستحقة قبل القانون. ويُحدَّث السجل آخر كل سنة.\nلائحة (135): في نهاية كل سنة يُعد بيان بما تبقى من الرصيد (في ظل القانون والمرحَّل للسنة الثالثة) مع المقابل النقدي على أساس الأجر الوظيفي، يُعتمد من السلطة المختصة أو من تفوضه خلال 15 يومًا من إعداده ويُرسل للإدارات المعنية للتنفيذ، وتُسلَّم صورة منه للموظف خلال 15 يومًا أخرى.\nلائحة (136): تُخطر الإدارة كل موظف برصيده خلال 30 يومًا من بداية السنة. ويجوز له أخذ إجازة السنة مضافًا إليها 60 يومًا من الرصيد السابق، مرة واحدة أو على فترات، دون المساس بكامل أجره.\nلائحة (137): تُثبَّت على الطلب تاريخ وروده وتُسلَّم للموظف صورة معتمدة. يُعرض في اليوم التالي على الرئيس المرخِّص ليقرر خلال يومي عمل، وعند الرفض يُعرض في اليوم التالي على السلطة المختصة أو من تفوضه لتقرر منح الإجازة أو رفضها بقرار مسبب خلال يومي عمل من تاريخ العرض عليها. فوات المواعيد دون بتّ = رفض. ولا يجوز الرفض إلا في حدود ثلث إجازات السنة. ويُودع بملف الخدمة طلب الإجازة وقرار الرئيس المرخِّص أو قرار السلطة المختصة، وتُسلَّم صورة منه للموظف.", "ex": "عدّيت الخمسين (51 سنة)، إجازتك 45 يوم. ولو عمرك 50 بالظبط لسه ما تجاوزتش الخمسين.", "test": {"q": "كم عدد أيام الإجازة الاعتيادية لمن أمضى 10 سنوات في الخدمة؟", "a": ["21 يوم", "30 يوم", "45 يوم"], "c": 1}}, {"id": "50", "title": "ترحيل الاعتيادية", "sim": "لازم تقدم طلب بإجازتك، ولو ماطلبتش بتضيع. والترحيل مش بيتم غير لمصلحة العمل.", "text": "يجب طلب الإجازة وإلا سقط حقه فيها وفي مقابلها. ترحيلها لمصلحة العمل فقط، حتى الثلث ولمدة 3 سنوات. لو طلبها ورفضت: مقابل نقدي بعد 3 سنوات.", "full": "يجب على الموظف أن يتقدم بطلب للحصول على كامل إجازاته الاعتيادية السنوية. ولا يجوز للوحدة ترحيلها إلا لأسباب تتعلق بمصلحة العمل وفى حدود الثلث على الأكثر ولمدة لا تزيد على ثلاث سنوات. وإذا لم يتقدم الموظف بطلب للحصول على إجازته على النحو المشار إليه، سقط حقه فيها وفي اقتضاء مقابل عنها، أما إذا تقدم بطلب للحصول عليها ورفضته السلطة المختصة استحق مقابلًا نقديًا عنها يُصرف بعد مرور ثلاث سنوات على انتهاء العام المستحق عنه الإجازة على أساس أجره الوظيفى في هذا العام. وتبين اللائحة التنفيذية إجراءات الحصول على الإجازة، وكيفية ترحيلها.", "reg": "لائحة (138): لا يجوز ترحيل الاعتيادية المستحقة بعد العمل بالقانون من سنة للتالية إلا بتوافر:\n١) طلب من الموظف.\n٢) قرار السلطة برفض الطلب لأسباب تتعلق بمصلحة العمل.\n٣) أن يكون الترحيل في حدود ثلث إجازات السنة ولمدة لا تزيد على ثلاث سنوات.\nلائحة (139): مخالفة المواد 134 إلى 138 إخلال بواجبات الوظيفة يوجب المساءلة التأديبية.", "ex": "ماقدمتش طلب إجازة السنة دي خالص، حقك فيها وفي فلوسها بيضيع.", "test": {"q": "هل يجوز ترحيل الإجازات الاعتيادية بدون طلب من الموظف؟", "a": ["نعم", "لا", "نعم، بقرار من الرئيس المباشر"], "c": 1}}, {"id": "51", "title": "الإجازة المرضية", "sim": "3 شهور بأجر كامل، 3 بـ75%، 6 بـ50%.", "text": "لكل 3 سنوات: 3 أشهر بأجر كامل، 3 أشهر بـ75%، 6 أشهر بـ50%.", "full": "يستحق الموظف إجازة مرضية عن كل ثلاث سنوات تقضى في الخدمة، وتُمنح بقرار من المجلس الطبي المختص في الحدود الآتية: 1 - الثلاثة أشهر الأولى بأجر كامل. 2 - الثلاثة أشهر التالية بأجر يعادل (75٪) من الأجر الوظيفى. 3 - الستة أشهر التالية بأجر يعادل (50٪) من أجره الوظيفى، (75٪) من الأجر الوظيفى لمن جاوز سن الخمسين. ويحق للموظف طلب مد الإجازة المرضية بدون أجر للمدة التي يحددها المجلس الطبي المختص إذا قرر احتمال شفائه. ويحق للموظف أن يطلب تحويل الإجازة المرضية إلى إجازة اعتيادية، إذا كان له رصيد منها، وعلى الموظف المريض أن يخطر جهة عمله عن مرضه خلال أربع وعشرين ساعة من انقطاعه عن العمل للمرض إلا إذا تعذر عليه ذلك لأسباب قهرية. وتضع السلطة المختصة الإجراءات المنظمة لحصول الموظف على الإجازة المرضية، ويعتبر التمارض إخلالاً بواجبات الوظيفة. ويمنح الموظف المريض بأحد الأمراض المزمنة التي يصدر بتحديدها قرار من وزير الصحة بناءً على موافقة المجلس الطبي المختص إجازة استثنائية بأجر كامل إلى أن يشفي، أو تستقر حالته استقراراً يمكنه من العودة إلى العمل أو يتبين عجزه عجزاً كاملاً، وفي هذه الحالة الأخيرة يظل الموظف في إجازة مرضية بذات الأجر حتى بلوغه سن الإحالة للمعاش. وإذا رغب الموظف المريض في إنهاء إجازته والعودة إلى عمله، وجب عليه أن يقدم طلبًا كتابيًا بذلك، وأن يوافق المجلس الطبي المختص على عودته.", "reg": "لائحة (140): إذا انقطع الموظف بسبب المرض داخل الجمهورية يبلغ رئيسه المباشر خلال 24 ساعة مع بيان محل إقامته، فيحيله في اليوم ذاته عن طريق الموارد البشرية للمجلس الطبي المختص. وإذا انتهت الإجازة دون شفاء يعيد الإبلاغ في اليوم التالي على الأكثر لإعادة الكشف، ويتكرر ذلك حتى عودته.\nلائحة (141): إذا كان خارج الجمهورية يبلغ وحدته خلال 24 ساعة عن طريق البعثة الدبلوماسية إن وجدت، ويحصل على تقرير طبي مصدق منها، ويقدمه لجهة عمله بعد عودته لإحالته للمجلس الطبي.\nلائحة (142): إذا لم يقرر المجلس الطبي مرض الموظف تحيله الوحدة للتحقيق؛ فإن ثبت تمارضه جوزي تأديبيًا.", "ex": "مرضت، بتخطر في أول يوم.", "test": {"q": "ما هي المدة التي يحصل فيها الموظف على إجازة مرضية بأجر كامل؟", "a": ["شهر", "3 أشهر", "6 أشهر"], "c": 1}}, {"id": "52", "title": "إجازات بأجر كامل", "sim": "الحج 30 يوم، الوضع 4 شهور.", "text": "الحج 30 يومًا مرة واحدة • الوضع 4 أشهر حتى 3 مرات.", "full": "تكون حالات الترخيص بإجازة خاصة بأجر كامل على الوجه الآتى: 1 - يستحق الموظف إجازة لمدة ثلاثين يومًا، ولمرة واحدة طوال مدة عمله بالخدمة المدنية لأداء فريضة الحج. 2 - تستحق الموظفة إجازة وضع لمدة أربعة أشهر، بحد أقصى ثلاث مرات طوال مدة عملها بالخدمة المدنية، على أن تبدأ هذه الإجازة من اليوم التالى للوضع، ويجوز أن تبدأ هذه الإجازة قبل شهر من التاريخ المتوقع للوضع بناءً على طلب مقدم من الموظفة وتقرير من المجلس الطبي المختص. 3 - يستحق الموظف المخالط لمريض بمرض مُعد إجازة للمدة التي يحددها المجلس الطبي المختص. 4 - يستحق الموظف الذى يصاب إصابة عمل إجازة للمدة التي يحددها المجلس الطبي المختص، وذلك مع مراعاة أحكام قانون التأمين الاجتماعى المشار إليه. 5 - يستحق الموظف المقيد بإحدى الكليات أو المعاهد أو المدارس إجازة عن أيام الامتحان الفعلية.", "reg": "لائحة (143): يُقصد بالحج زيارة الأراضي المقدسة أو بيت المقدس.\nلائحة (144): تستحق الموظفة إجازة الوضع حتى لو توفي مولودها.\nلائحة (145): الموظف الذي يحصل على إجازة لأداء الامتحان يقدم ما يفيد دخوله الامتحان وإلا يُساءل تأديبيًا.", "ex": "الموظفة بتاخد 4 شهور وضع.", "test": {"q": "كم مدة إجازة الوضع للموظفة؟", "a": ["3 أشهر", "4 أشهر", "6 أشهر"], "c": 1}}, {"id": "53", "title": "إجازات بدون أجر", "sim": "إجازة من غير راتب طول مدة سفر زوجك/زوجتك (لو السفر 6 شهور أو أكتر)، أو لرعاية الطفل.", "text": "بدون أجر: مدة سفر الزوج/الزوجة (بشرط سفر 6 أشهر على الأقل) • رعاية الطفل عامين في المرة وبحد أقصى 6 أعوام.", "full": "تكون حالات الترخيص بالإجازة بدون أجر على الوجه الآتى: 1 - يُمنح الزوج أو الزوجة إذا سافر أحدهما إلى الخارج للعمل أو للدراسة لمدة ستة أشهر على الأقل إجازة بدون أجر مدة بقاء الزوج أو الزوجة في الخارج، وفى جميع الأحوال يتعين على الوحدة أن تستجيب لطلب الزوج أو الزوجة. 2 - يجوز للسلطة المختصة منح الموظف إجازة بدون أجر للأسباب التي يبديها وتقدرها السلطة المختصة ووفقًا لحاجة العمل. ولا يجوز في البندين السابقين ترقية الموظف إلا بعد عودته من الإجازة واستكمال المدة البينية اللازمة لشغل الوظيفة الأعلى مباشرة، ولا تدخل مدد الإجازات المنصوص عليها في هذين البندين ضمن المدد البينية اللازمة للترقية. 3 - مع مراعاة أحكام قانون الطفل الصادر بالقانون رقم (12) لسنة 1996، تستحق الموظفة إجازة بدون أجر لرعاية طفلها لمدة عامين على الأكثر في المرة الواحدة وبحد أقصى ستة أعوام طوال مدة عملها بالخدمة المدنية. واستثناءً من أحكام قانون التأمين الاجتماعي المشار إليه، تتحمل الوحدة اشتراكات التأمين المستحقة عليها وعلى الموظفة.", "reg": "لائحة (146): تستحق الموظفة إجازة بدون أجر لرعاية طفلها لمدة عامين على الأكثر في المرة الواحدة.\nلائحة (92): لا يجوز النظر في ترقية الموظف الحاصل على إجازة بدون أجر إلا بعد عودته، عدا الإجازة المرضية وإجازة رعاية الطفل.", "ex": "مسافرة مع زوجها برة، بتاخد إجازة بدون أجر.", "test": {"q": "كم مدة إجازة رعاية الطفل بدون أجر في المرة الواحدة؟", "a": ["سنة", "عامين", "3 أعوام"], "c": 1}}, {"id": "54", "title": "العمل بعض الوقت", "sim": "ممكن تاخد ترخيص تشتغل وقت أقل.", "text": "للسلطة الترخيص بذلك بطلبه مقابل نسبة من الأجر.", "full": "يجوز للسلطة المختصة، وفقًا للقواعد التي تضعها، الترخيص للموظف بأن يعمل بعض الوقت بناءً على طلبه وذلك مقابل نسبة من الأجر. ويستحق الموظف في هذه الحالة الإجازات الاعتيادية والعارضة والمرضية المقررة له بما يتفق مع الجزء من الوقت الذي خصصه لعمله. وتحدد اللائحة التنفيذية قواعد احتساب الأجر المشار إليه. واستثناءً من أحكام قانون التأمين الاجتماعي المشار إليه، تؤدى الاشتراكات المستحقة وفقًا لأحكام هذا القانون من الأجر المخفض على أساس الأجر الكامل، وتدخل المدة بالكامل ضمن مدة اشتراكه.", "reg": "لائحة (147): يجوز للسلطة المختصة الترخيص للموظف بالعمل ثلاثة أيام عمل أيًّا كان عدد أيام العمل بالوحدة، ويحصل على 65% من أجره الوظيفي والمكمل والإجازات الاعتيادية والمرضية والعارضة المقررة.", "ex": "ظروفك صعبة، تشتغل 3 أيام وتاخد 65%.", "test": {"q": "من الذي يملك سلطة الترخيص بالعمل بعض الوقت؟", "a": ["السلطة المختصة", "الرئيس المباشر", "النقابة"], "c": 0}}, {"id": "55", "title": "المجند والمستبقى", "sim": "اللي في الجيش مش بياخد الإجازات دي.", "text": "لا يستحقون الإجازات المنصوص عليها طوال وجودهم بالقوات المسلحة.", "full": "لا يستحق المجند والمستبقى للاحتياط والمستدعى لأية إجازة تم النص عليها في هذا القانون طوال مدة وجوده بالقوات المسلحة.", "reg": "لا توجد مادة مقابلة في اللائحة. (لائحة 148 تخص إجازات المعيَّن لأول مرة في فترة الاختبار، وهي مذكورة في مادة 48.)", "ex": "مجند، مش بياخد إجازة سنوية.", "test": {"q": "هل يستحق المجند الإجازات الاعتيادية أثناء وجوده بالقوات المسلحة؟", "a": ["نعم", "لا", "نعم، نصف الإجازات فقط"], "c": 1}}, {"id": "56", "title": "العمل للغير في الإجازة", "sim": "ممنوع تشتغل في مكان تاني وانت في إجازة.", "text": "محظور بغير ترخيص، وإلا حُرم من أجر الإجازة.", "full": "يُحظر على الموظف أن يؤدى عملاً للغير بأجر أو بدون أجر خلال مدة الإجازة بغير ترخيص من السلطة المختصة، وإلا حُرم من أجره عن مدة الإجازة، وللوحدة أن تسترد ما أدته إليه من أجر عن هذه المدة، وذلك دون الإخلال بالمسئولية التأديبية.", "reg": "لائحة (150): يُحظر على الموظف الجمع بين وظيفته وأي عمل آخر يؤديه بنفسه أو بالواسطة إذا كان يضر بأداء واجبات الوظيفة (بند 9)، وأداء أعمال للغير بأجر أو بمكافأة ولو في غير أوقات العمل الرسمية إلا بإذن السلطة المختصة (بند 10). ويجوز له تولي أعمال القوامة أو الوصاية أو الوكالة عن الغائبين أو المساعدة القضائية إذا كان المشمول بها ممن تربطهم به صلة قربى أو نسب حتى الدرجة الرابعة.", "ex": "اشتغلت في شركة وانت في إجازة، بتتحرم من أجرها.", "test": {"q": "ما هي عقوبة الموظف الذي يعمل للغير أثناء إجازته بدون ترخيص؟", "a": ["إنذار", "الحرمان من أجر الإجازة", "خصم 3 أيام"], "c": 1}}, {"id": "71", "title": "بدل رصيد الإجازات", "sim": "الإجازات القديمة اللي ماخدتهاش بتاخد فلوسها.", "text": "مقابل نقدي عن رصيد الاعتيادية المتكون قبل العمل بالقانون.", "full": "يستحق الموظف عند انتهاء خدمته مقابلًا عن رصيد إجازاته الاعتيادية الذي تكوَّن قبل العمل بأحكام هذا القانون ولم يستنفدها قبل انتهاء خدمته. ويحسب المقابل النقدى على أساس الأجر الأساسى مضافًا إليه العلاوات الخاصة التي كان يتقاضاها حتى تاريخ العمل بهذا القانون.", "reg": "لائحة (186): يستحق الموظف عند انتهاء خدمته مقابلًا عن رصيد إجازاته الاعتيادية الذي تكوَّن قبل العمل بالقانون ولم يستنفذه، ويُحسب المقابل النقدي على أساس الأجر الأساسي مضافًا إليه العلاوات الخاصة التي كان يتقاضاها حتى تاريخ العمل بالقانون. وتعد الموارد البشرية بيانًا تفصيليًا من ملف خدمة الموظف وسجل إجازاته يحدد رصيد الإجازات المتبقي وقيمة المقابل النقدي، ويعتمده السلطة المختصة خلال 15 يومًا من إعداده ويُرسل للإدارات المعنية للتنفيذ، وتُسلم صورة منه للموظف مرفقًا بها إخطار بمواعيد الصرف. ويُصرف المقابل وفقًا لنظام يصدر بقرار من وزير المالية.\nلائحة (192): يستحق الموظف نصف رصيد الإجازات الاعتيادية والعارضة وفق القواعد المقررة قبل القانون عن الفترة من 2017/1/1 حتى 2017/6/30، ويُجبر الكسر لصالح الموظف.", "ex": "عندك رصيد قديم، بتاخد قيمته فلوس.", "test": {"q": "هل يستحق الموظف مقابل نقدي عن رصيد إجازاته القديم عند انتهاء الخدمة؟", "a": ["نعم", "لا", "لا يستحق إلا بحكم قضائي"], "c": 0}}];
var LAW_ALL=[{"id": "إ1", "title": "سريان القانون", "sim": "القانون ده بيتطبق على أي حد شغال في الوزارات والمحافظات والهيئات العامة، إلا لو قانون إنشاء الجهة نفسه نص على غير كده.", "text": "يُعمل به على الوظائف في الوزارات والمصالح والأجهزة الحكومية ووحدات الإدارة المحلية والهيئات العامة.", "full": "يُعمل بأحكام القانون المرافق في شأن الخدمة المدنية، وتسري أحكامه على الوظائف في الوزارات ومصالحها والأجهزة الحكومية ووحدات الإدارة المحلية، والهيئات العامة وذلك ما لم تنص قوانين أو قرارات إنشائها على ما يخالف ذلك.", "reg": "قرار رئيس الوزراء 1216/2017 مادة (1): يُعمل بأحكام اللائحة التنفيذية المرافقة في شأن قانون الخدمة المدنية.", "ex": "أحمد في وزارة الصحة يسري عليه، خالد في شركة قطاع عام لا يسري عليه.", "test": {"q": "هل يسري هذا القانون على العاملين في شركات قطاع الأعمال العام؟", "a": ["نعم", "لا، يسري على الجهات الحكومية فقط", "يسري على القطاع العام والخاص معًا"], "c": 1}}, {"id": "إ2", "title": "إلغاء القانون القديم", "sim": "قانون 47 لسنة 1978 اتلغى خلاص، وأي مادة قديمة بتخالفه مالهاش لازمة.", "text": "يُلغى قانون العاملين المدنيين رقم 47 لسنة 1978، ويُلغى أي حكم يخالف القانون الجديد.", "full": "يُلغى قانون نظام العاملين المدنيين بالدولة الصادر بالقانون رقم 47 لسنة 1978، كما يلغى كل حكم يخالف أحكام القانون المرافق.", "reg": "قرار 1216/2017 مادة (2): تُلغى اللائحة التنفيذية لقانون نظام العاملين المدنيين بالدولة (الصادرة بقرار لجنة شئون الخدمة المدنية رقم 2 لسنة 1978)، ويُلغى كل حكم يخالف أحكام اللائحة المرافقة.", "ex": "أي مادة قديمة بتقول سن المعاش 60، بتتلغي لو القانون الجديد قال غير كده.", "test": {"q": "ما هو رقم القانون القديم الذي تم إلغاؤه بموجب هذا القانون؟", "a": ["قانون 47 لسنة 1978", "قانون 12 لسنة 2003", "قانون 81 لسنة 2016"], "c": 0}}, {"id": "إ3", "title": "اللائحة التنفيذية", "sim": "اللائحة هي (الكتالوج) اللي بيشرح إزاي نطبق القانون خطوة بخطوة.", "text": "يصدرها رئيس الوزراء خلال 3 أشهر، وحتى صدورها تستمر اللوائح القائمة.", "full": "يُصدر رئيس مجلس الوزراء بعد أخذ رأى مجلس الخدمة المدنية اللائحة التنفيذية للقانون المرافق خلال ثلاثة أشهر من تاريخ العمل به وإلى أن تصدر هذه اللائحة يستمر العمل باللوائح والقرارات القائمة حالياً فيما لا يتعارض وأحكام القانون المرافق.", "reg": "صدرت بقرار رئيس مجلس الوزراء رقم 1216 لسنة 2017 (بعد أخذ رأي مجلس الخدمة المدنية ومجلس الدولة)، ونُشرت في الجريدة الرسمية العدد 21 مكرر في 27 مايو 2017، ويُعمل بها من اليوم التالي للنشر.", "ex": "اللائحة بتقولك الأوراق المطلوبة للتعيين بالتفصيل.", "test": {"q": "من الذي يصدر اللائحة التنفيذية لهذا القانون؟", "a": ["رئيس الجمهورية", "رئيس مجلس الوزراء", "وزير المالية"], "c": 1}}, {"id": "إ4", "title": "نقل الموظفين", "sim": "الموظفين القدام بيتم نقلهم للجداول الجديدة، ولو راتبهم القديم أعلى بياخدوه.", "text": "ينقل الموظفون للوظائف المعادلة بالجداول 1 و2 و3، ويحتفظ كل منهم بأجره المقرر إن زاد.", "full": "يُنقل الموظفون المعينون الموجودون بالخدمة قبل العمل بأحكام هذا القانون إلى الوظائف المعادلة لوظائفهم الحالية على النحو الموضح بالجداول أرقام (1، 2، 3) الملحقة بالقانون المرافق بما فيها المستوى الوظيفي الأول (أ)، ويكون ترتيب الأقدمية بين المنقولين لوظيفة واحدة بحسب أوضاعهم السابقة. ويحتفظ كل منهم بالأجر المقرر له قانونًا والذي كان يتقاضاه إذا زاد على الأجر الوظيفي المقرر لمستوى وظيفته في الجداول الملحقة بالقانون المرافق، أما إذا قلّ الأجر المحتفظ به عن الأجر الوظيفي المقرر لمستوى وظيفته يصرف له الأجر الوظيفي المقرر في الجداول المشار إليها. ذلك كله مع عدم الإخلال بالقوانين والقرارات المنظمة للحدين الأدنى والأقصى للدخول.", "reg": "لا توجد مادة مقابلة مباشرة.", "ex": "موظف كان بياخد 5000، الوظيفة الجديدة 4500، بياخد 5000 محتفظ بيها.", "test": {"q": "إذا كان راتب الموظف القديم أعلى من راتب وظيفته الجديدة، ماذا يحدث؟", "a": ["يخفض راتبه للجديد", "يحتفظ براتبه القديم", "يأخذ متوسط الراتبين"], "c": 1}}, {"id": "إ5", "title": "النشر والنفاذ", "sim": "القانون بيتطبق من تاني يوم بعد ما يتنشر في الجريدة الرسمية.", "text": "ينشر في الجريدة الرسمية ويُعمل به من اليوم التالي للنشر.", "full": "يُنشر هذا القانون في الجريدة الرسمية، ويُعمل به من اليوم التالي لتاريخ نشره. يُبصم هذا القانون بخاتم الدولة، ويُنفذ كقانون من قوانينها.", "reg": "نُشر القانون في الجريدة الرسمية العدد 43 مكرر (أ) في أول نوفمبر 2016.", "ex": "نشر يوم 1 نوفمبر، يطبق يوم 2 نوفمبر.", "test": {"q": "متى يُعمل بهذا القانون؟", "a": ["من تاريخ التوقيع", "من اليوم التالي للنشر", "بعد مرور 3 أشهر"], "c": 1}}, {"id": "1", "title": "الوظيفة حق وتكليف", "sim": "الوظيفة مش ملك حد، هي حق لكل مصري كفء، وممنوع التفرقة بسبب الدين أو الجنس.", "text": "الوظائف حق للمواطنين على أساس الكفاءة والجدارة، ويُحظر التمييز بسبب الدين أو الجنس.", "full": "الوظائف المدنية حق للمواطنين على أساس الكفاءة والجدارة، وهي تكليف للقائمين بها لخدمة الشعب، وتكفل الدولة حقوقهم وحمايتهم، وقيامهم بأداء واجباتهم في رعاية مصالح الشعب. ويُحظر التمييز بين الموظفين في تطبيق أحكام هذا القانون بسبب الدين أو الجنس أو لأي سبب آخر.", "reg": "لائحة (1): على كل وحدة: تطبيق القانون واللائحة على جميع الموظفين بعدالة ونزاهة وشفافية دون تمييز أو محاباة، وتعريفهم بحقوقهم وواجباتهم وأهداف الوحدة بتدريب مبدئي عند التحاقهم لأول مرة، وتحديث هيكلها دوريًا، واستطلاع رأي الجمهور في جودة الخدمات، وتلافي أوجه القصور بالتدريب المستمر.\nلائحة (3): يُنشأ لكل موظف ملف إلكتروني أو ورقي (أو كلاهما) تُودع به وثائقه وبياناته والملاحظات المتعلقة بعمله وتقارير تقويم أدائه، وما يثبت جديته من الشكاوى والبلاغات ضده بعد التحقيق وسماع أقواله؛ ويجب أن يكون الملف الإلكتروني مؤمَّنًا، وأن تُرقَّم أوراق الورقي ويثبت مضمونها على غلافه ولا يجوز نزع أي ورقة منه بعد إيداعها.", "ex": "ممنوع ترفض تعيين شخص كفء لمجرد إنه مسيحي أو أنثى.", "test": {"q": "هل يجوز التمييز بين الموظفين بسبب الدين أو الجنس؟", "a": ["نعم", "لا، يُحظر التمييز", "يجوز بشرط موافقة الرئيس المباشر"], "c": 1}}, {"id": "2", "title": "التعريفات", "sim": "بيحدد معنى الكلمات اللي هنتكرر كتير زي (السلطة المختصة، الوحدة، الرئيس المباشر).", "text": "يعرّف السلطة المختصة، الوحدة، الوظائف القيادية، الموظف، الأجر الوظيفي، والجهاز.", "full": "يُقصد في تطبيق أحكام هذا القانون بالكلمات والعبارات التالية المعنى المبين قرين كل منها: 1 - السلطة المختصة: الوزير أو المحافظ أو رئيس مجلس إدارة الهيئة بحسب الأحوال. 2 - الوحدة: الوزارة أو المصلحة أو الجهاز الحكومي أو المحافظة أو الهيئة العامة. 3 - الوظائف القيادية: وظائف المستويات الثلاثة التالية للسلطة المختصة والتي يرأس شاغلوها وحدات تقسيمات تنظيمية بالوحدة من مستوى إدارة عامة أو إدارة مركزية أو قطاعات، وما يعادلها من تقسيمات. 4 - وظائف الإدارة الإشرافية: وظائف المستوى التالي للوظائف القيادية، والتي يرأس شاغلوها إدارات بالوحدة. 5 - الموظف: كل من يشغل إحدى الوظائف الواردة بموازنة الوحدة. 6 - الأجر الوظيفي: الأجر المنصوص عليه في الجداول الملحقة بهذا القانون مضمومًا إليه جميع العلاوات المقررة بمقتضى هذا القانون. 7 - الأجر المكمل: كل ما يحصل عليه الموظف نظير عمله بخلاف الأجر الوظيفي. 8 - كامل الأجر: كل ما يحصل عليه الموظف نظير عمله من أجر وظيفي وأجر مكمل. 9 - السنة: السنة المالية للدولة. 10 - الوزير المختص: الوزير المعنى بالخدمة المدنية. 11 - الجهاز: الجهاز المركزي للتنظيم والإدارة.", "reg": "لائحة (2): كرّرت تعريفات القانون وأضافت تعريفي (القانون) و(الرئيس المباشر): مدير الإدارة أو المدير العام أو رئيس الإدارة المركزية أو رئيس القطاع وفقًا للتدرج الوظيفي الإشرافي لكل منهم.", "ex": "لما نقرأ 'السلطة المختصة' نعرف إنها الوزير أو المحافظ.", "test": {"q": "من هي 'السلطة المختصة' في الوزارة؟", "a": ["الوزير", "مدير عام الموارد البشرية", "رئيس الجهاز"], "c": 0}}, {"id": "3", "title": "مجلس الخدمة المدنية", "sim": "مجلس بيقدم مقترحات وبيبدي الرأي في تطوير الخدمة المدنية: رئيسه رئيس الجهاز، ومعاه 3 من كبار المسؤولين بحكم مناصبهم + عضو نقابي + 4 خبراء.", "text": "يُبدي المشورة والرأي في قضايا الخدمة المدنية ومشروعات القوانين واللوائح والتدريب والموازنة. برئاسة رئيس الجهاز، وعضويته: رئيس الجمعية العمومية للفتوى والتشريع، ورئيس قطاع الخدمة المدنية، ورئيس قطاع الموازنة، وعضو نقابي، و4 خبراء لمدة 3 سنوات تُجدد مرة واحدة.", "full": "يُنشأ مجلس للخدمة المدنية بغرض تقديم المقترحات الخاصة بتطوير الخدمة المدنية وتحسين الخدمات العامة في البلاد، ويقوم على وجه الخصوص بالآتي: (أ) إبداء المشورة فيما يُطرح عليه من قضايا الخدمة المدنية، سواء من رئيس مجلس الوزراء أو الوزير المختص أو رئيس الجهاز. (ب) إبداء الرأي في مشروعات القوانين واللوائح المتعلقة بالخدمة المدنية. (ج) إبداء الرأي في طريقة ومعايير تقييم الجهات الحكومية وموظفي الخدمة المدنية. (د) إبداء الرأي في البرامج التدريبية المقدمة لموظفي الخدمة المدنية. (هـ) إبداء الرأي في القضايا المتعلقة بالأخلاقيات المهنية لموظفي الخدمة المدنية. (و) تقديم المقترحات فيما يتعلق بالموازنة المخصصة للخدمة المدنية. (ز) تقديم مقترحات تحسين أداء الخدمة المدنية. ويُشكل مجلس الخدمة المدنية برئاسة رئيس الجهاز وعضوية كل من: 1- رئيس الجمعية العمومية لقسمي الفتوى والتشريع بمجلس الدولة. 2- رئيس قطاع الخدمة المدنية بالجهاز. 3- رئيس قطاع الموازنة العامة للدولة بوزارة المالية. 4- عضو من المنظمات النقابية المنتخبة يختاره الاتحاد العام لنقابات عمال مصر. 5- أربعة خبراء في الإدارة والموارد البشرية والقانون يختارهم الوزير المختص لمدة ثلاث سنوات قابلة للتجديد ولمرة واحدة. ويكون للمجلس أمانة فنية يصدر بتشكيلها قرار من رئيس المجلس. ويضع المجلس لائحة داخلية تتضمن القواعد والإجراءات المتعلقة بسير العمل به وأمانته الفنية. وتعتمد توصيات المجلس من الوزير المختص.", "reg": "لا توجد مادة في اللائحة مخصصة لمجلس الخدمة المدنية. يُذكر المجلس فيها في: لائحة (24): قرار رئيس الجهاز بتوصيف الوظائف يصدر بعد العرض عليه، ولائحة (30): تحديث بنك الأسئلة في ضوء مقترحاته.", "ex": "قبل إصدار لائحة الخدمة المدنية أُخذ رأي المجلس ده، وهو كمان بيبدي رأيه في أي مشروع قانون أو لائحة جديدة تخص الموظفين.", "test": {"q": "كم مدة عضوية الخبراء في مجلس الخدمة المدنية؟", "a": ["3 سنوات", "4 سنوات", "5 سنوات"], "c": 0}}, {"id": "4", "title": "لجنة الموارد البشرية", "sim": "لجنة في كل مصلحة بتنظر التعيينات الصغيرة (الأولى ب وما دونها).", "text": "رئيس + 4 أعضاء، تنظر التعيين في الأولى (ب) فما دونها. لو مااعترضتش في 30 يوم القرار بيمشي.", "full": "تُشكل في كل وحدة، بقرار من السلطة المختصة، لجنة أو أكثر للموارد البشرية، برئاسة أحد موظفي الوحدة من شاغلي الوظائف القيادية وعضوية أربعة أعضاء، يكون من بينهم أحد القانونيين وأحد المتخصصين في الموارد البشرية من داخل الوحدة أو خارجها، وأحد أعضاء اللجنة النقابية إن وجدت يختاره مجلس إدارة اللجنة النقابية. وتختص اللجنة بالنظر في التعيين في الوظائف من المستوى الأول (ب) فما دونها، ومنح العلاوات لشاغليها ونقلهم خارج الوحدة واعتماد تقارير تقويم أدائهم، واقتراح البرامج والدورات التدريبية اللازمة لتنمية الموارد البشرية، وتغيير مفاهيمهم الوظيفية وثقافتهم وتطوير أساليب العمل ورفع معدلات الأداء، وغير ذلك مما يُحال إليها من السلطة المختصة. وتُرسل اللجنة اقتراحاتها إلى السلطة المختصة خلال أسبوع لاعتمادها، فإذا لم تعتمدها ولم تُبد اعتراضًا عليها خلال ثلاثين يومًا من تاريخ وصولها اعتبرت نافذة. أما إذا اعترضت على اقتراحات اللجنة كلها أو بعضها، فيتعين أن تُبدي الأسباب المبررة لذلك كتابة وتُعيد ما اعترضت عليه للجنة للنظر فيه في ضوء هذه الأسباب، وتُحدد لها أجلًا للبت فيه، فإذا انقضى هذا الأجل دون أن تبدي اللجنة رأيها اعتُبر رأي السلطة المختصة، أما إذا تمسكت اللجنة برأيها خلال الأجل المحدد، تُرسل اقتراحاتها إلى السلطة المختصة لاتخاذ ما تراه بشأنها ويُعتبر قرارها في هذه الحالة نهائيًا. وتحدد اللائحة التنفيذية كيفية اختيار أعضاء اللجنة ونظام العمل بها.", "reg": "لائحة (4): العضوية: أحد المتخصصين في الموارد البشرية، والمسئول الأول عن الشئون القانونية أو من يفوضه، وأحد أعضاء اللجنة النقابية (أو عضو ترشحه النقابة العامة إن لم توجد لجنة)، والمسئول الأول عن الموارد البشرية أو من يفوضه. أمين اللجنة من موظفي الموارد البشرية بلا صوت معدود. تجتمع مرة شهريًا على الأقل بدعوة من الرئيس، ولا يصح الانعقاد إلا بحضور 3 أعضاء بمن فيهم الرئيس.\nلائحة (5): محاضرها في سجل مرقم، ولا تصح اقتراحاتها إلا بالأغلبية المطلقة للحاضرين، وعند التساوي يُرجَّح الجانب الذي فيه الرئيس.\nلائحة (6): لا تُستخرج صور المحاضر إلا بقرار السلطة المختصة أو جهة قضائية أو بطلب الجهاز.", "ex": "اللجنة اقترحت تعيين شخص، مر شهر والوزير مااعترضش، يبقى القرار نافذ.", "test": {"q": "إذا لم تعترض السلطة المختصة على اقتراح اللجنة خلال 30 يوماً، ماذا يحدث؟", "a": ["يُرفض الاقتراح", "يصبح الاقتراح نافذاً", "يُعاد التصويت"], "c": 1}}, {"id": "5", "title": "نشر القرارات", "sim": "قرارات الخدمة المدنية لازم تتنشر في نشرة رسمية أو على الموقع.", "text": "تُعلن قرارات الخدمة المدنية في نشرة رسمية ورقية أو إلكترونية.", "full": "تُعلن القرارات التي تصدر في شأن الخدمة المدنية في نشرة رسمية تصدرها الوحدة ورقياً أو إلكترونياً. وتحدد اللائحة التنفيذية كيفية وإجراءات النشر أو الإتاحة على نحو يكفل علم ذوى الشأن بها.", "reg": "لائحة (7): تُعلن القرارات بالإتاحة على الموقع الإلكتروني للوحدة أو بالنشر في لوحة إعلانات واحدة على الأقل في أماكن ثابتة وبارزة بالمركز الرئيسي للوحدة وفروعها، لمدة لا تقل عن 10 أيام. وتثبت الإتاحة أو النشر أو الرفع بمحضرين رسميين عن طريق إدارة الموارد البشرية مع تسجيلها في سجل.", "ex": "قرار ترقية لازم يتنشر على موقع الوزارة.", "test": {"q": "كيف تُعلن قرارات الخدمة المدنية؟", "a": ["في نشرة رسمية ورقية أو إلكترونية", "عبر الرسائل النصية", "في الجرائد اليومية فقط"], "c": 0}}, {"id": "6", "title": "مجلس الدولة", "sim": "لو في مشكلة في تفسير مادة، بنسأل مجلس الدولة بس.", "text": "يختص وحده بإبداء الرأي مسببًا في مسائل تطبيق القانون.", "full": "يختص مجلس الدولة، دون غيره، بإبداء الرأي مسبباً في المسائل المتعلقة بتطبيق أحكام هذا القانون ولائحته التنفيذية، بناءً على طلب السلطة المختصة.", "reg": "لائحة (8): ينشئ الجهاز قاعدة بيانات بفتاوى مجلس الدولة في مسائل تطبيق القانون واللائحة، مع تلخيص المبادئ القانونية ونشرها على موقعه.\nلائحة (9): للسلطة المختصة أو من ينوب عنها طلب الرأي بعرض شامل ومفصل للوقائع مشفوعًا بحالة واقعية ومرفقًا به المستندات، ويُخطر الجهاز بصورة من الطلب وبصورة من الفتوى قبل تنفيذها.", "ex": "الوزير بيسأل مجلس الدولة لو محتاج يفسر مادة.", "test": {"q": "من الجهة الوحيدة المختصة بإبداء الرأي في مسائل تطبيق القانون؟", "a": ["مجلس النواب", "مجلس الدولة", "النيابة الإدارية"], "c": 1}}, {"id": "7", "title": "الثقافة والتدريب", "sim": "كل وزارة أو مصلحة تدرّب موظفيها، وتقدر تنشئ مركز تدريب خاص بيها بعد موافقة الجهاز المركزي.", "text": "الوحدة تدرب وتؤهل الموظفين، ولكل وحدة إنشاء مركز لتنمية الموارد البشرية.", "full": "تعمل الوحدة على تدريب وتأهيل وإعداد الموظفين للقيام بواجباتها ومسئولياتها على نحو يكفل تنمية ثقافة الخدمة المدنية ودورها في المجتمع وتحقيق أهدافها. ولكل وحدة إنشاء مركز لتنمية الموارد البشرية، بعد موافقة الجهاز لتدريب وتأهيل وإعداد الموظفين بها وبالمصالح أو الوحدات أو الفروع التابعة لها، ويجوز إسناد عمليات التدريب والتأهيل والإعداد إلى مراكز وهيئات التدريب التي يصدر باعتمادها قرار من رئيس الجهاز. وتحدد اللائحة التنفيذية إجراءات وضوابط إنشاء مراكز تنمية الموارد البشرية ونظام التدريب والتأهيل والإعداد وضوابط الالتحاق بها والشهادات التي تمنحها.", "reg": "لائحة (10): تضع كل وحدة خطة سنوية لتدريب موظفيها بكل مستوياتهم (خاصة عند دخول الخدمة وعند الترقية).\nلائحة (11): تُدرج كل وحدة في مشروع موازنتها الاعتمادات المالية اللازمة لتنفيذ خطة التدريب، مشفوعة بالخطة المزمع تنفيذها.\nلائحة (12): تتولى إدارة الموارد البشرية تنفيذ خطة التدريب بعد اعتمادها من السلطة المختصة وتقييم التدريب، للتعرف على المشاكل الإدارية والتنظيمية المؤثرة عليه، والتحقق من تلبية الأهداف لاحتياجات الوحدة، وصلاحية أساليب التدريب، وكفاءة المدربين، وقياس فاعلية التدريب وأثره على المتدرب.\nلائحة (13): يكون التقييم من خلال تقارير المشرفين على البرامج (انتظام المتدربين واهتمامهم)، وتقارير المتدربين، وتقارير الرؤساء المباشرين عن أثر التدريب على الأداء، بنماذج تعدها إدارة الموارد البشرية.\nلائحة (14): تُعد إدارة الموارد البشرية تقريرًا سنويًا عن تنفيذ الخطة مصحوبًا بالإحصاءات والنتائج ومقارنتها بالسنوات السابقة ومرفقًا به خطة العام التالي، ويُعرض على لجنة الموارد البشرية تمهيدًا لاعتماده من السلطة المختصة.\nلائحة (15): فترة التدريب تُعتبر فترة عمل، والانقطاع عن التدريب بغير عذر مقبول انقطاع عن العمل.\nلائحة (16): يستحق الموظف كامل أجره خلال التدريب، وعليه اجتياز نسبة النجاح؛ وإن لم يجتزها تُسترد منه المصروفات إذا كان التحاقه بناءً على طلبه.\nلائحة (17): من دُرّب خارج مصر يلتزم بالبقاء في الخدمة 6 أشهر على الأقل أو ضعف مدة التدريب أيهما أطول، ومن دُرّب داخل مصر ضعف مدة التدريب.\nلائحة (18): لإنشاء مركز لتنمية الموارد البشرية لا يقل عدد موظفي الوحدة عن 500، مع جدوى وتجهيزات ومدربين وبرامج معتمدة.\nلائحة (19): يضع المركز نظام التدريب والتأهيل مراعيًا: تحديد وتحليل الاحتياجات التدريبية في الربع الأخير من كل سنة بالتعاون مع إدارة الموارد البشرية، وتخطيط البرامج بناءً على اقتراح لجنة الموارد البشرية، وإتاحة خطة التدريب على موقع الوحدة في بداية كل سنة، والتركيز على الجانب العملي والأساليب التفاعلية، وعرض البرامج على السلطة المختصة لاعتمادها.\nلائحة (20): الترشيح للبرامج التي ينظمها المركز يكون من قبل إدارة الموارد البشرية، ويجوز للوحدة قبول طلب الموظف بالالتحاق بأحد البرامج وفقًا لاحتياجاته الوظيفية.\nلائحة (21): تمنح مراكز تنمية الموارد البشرية شهادات تدريب عامة متخصصة في مجالات عمل الوحدة، تتضمن مراتب اجتياز التدريب.", "ex": "وزارة عندها 500 موظف أو أكتر بتنشئ مركز تدريب بعد موافقة الجهاز المركزي للتنظيم والإدارة.", "test": {"q": "هل يعتبر انقطاع الموظف عن التدريب انقطاعاً عن العمل؟", "a": ["نعم", "لا", "حسب تقدير الرئيس"], "c": 0}}, {"id": "8", "title": "تدريب الشباب", "sim": "المصلحة ممكن تدرب شباب من غير ما تلزم بتعيينهم.", "text": "للوحدة تدريب الشباب بناء على طلبهم دون التزام بتعيينهم.", "full": "يجوز للوحدة أن تقوم بتدريب الشباب على الأنشطة والأعمال التخصصية بها بناءً على طلبهم دون التزامها بتعيينهم، وذلك على النحو الذي تنظمه اللائحة التنفيذية.", "reg": "لائحة (22): يجوز للوحدة تدريب الشباب (ومنهم الطلاب) بناءً على طلبهم، بالتعاون مع الجهات الحكومية ومؤسسات المجتمع المدني وأصحاب الأعمال، لإكسابهم مهارات سوق العمل. ويشمل نظام التدريب: نموذج الطلب، والقواعد والشروط، وحقوق والتزامات المتدرب، والجزاءات، والشهادة. ولا يترتب على التدريب أي التزام على الوحدة بالتعيين.", "ex": "خريج بيتدرب في الوزارة صيفاً ومش شرط يتعين.", "test": {"q": "هل يلتزم الجهاز بتعيين الشباب المتدربين؟", "a": ["نعم", "لا، دون التزام بتعيينهم", "نعم، إذا اجتاز التدريب بنجاح"], "c": 1}}, {"id": "9", "title": "الهيكل وجدول الوظائف", "sim": "كل وحدة تضع هيكلها (تعتمده السلطة المختصة بعد أخذ رأي الجهاز) وجدول وظائفها ببطاقات الوصف، ورئيس الجهاز هو اللي يعتمد جدول الوظائف.", "text": "كل وحدة تضع هيكلها التنظيمي وجدول وظائف مع بطاقات وصف.", "full": "تضع كل وحدة هيكلاً تنظيمياً لها، يعتمد من السلطة المختصة، بعد أخذ رأي الجهاز يتضمن تقسيمها إلى تقسيمات فرعية تتناسب مع أنشطتها وحجم ومجالات العمل بها. وتضع كل وحدة جدولاً للوظائف مرفقاً به بطاقات وصف كل وظيفة، تتضمن تحديد مستواها الوظيفي وطريقة شغلها والمجموعة الوظيفية التي تنتسب إليها والشروط اللازم توافرها فيمن يشغلها، والواجبات والمسئوليات والمهام المنوطة بها، ومؤشرات قياس أدائها. ويختص رئيس الجهاز باعتماد جدول وظائف كل وحدة وحجم الموارد البشرية اللازمة لها في ضوء احتياجاتها الفعلية.", "reg": "لائحة (23): يجوز للوحدة تعديل هيكلها التنظيمي وجدول وظائفها بعد العرض على الجهاز، وعليها إمداده بما يطلبه من بيانات.\nلائحة (27): على إدارة الموارد البشرية كل 6 أشهر وكلما رأت السلطة إعداد بيان بالوظائف الممولة موزعة على مجموعاتها، والمشغولة والشاغرة بحسب الحصر الفعلي، مع خطة إحلال، ويُرسل للجهاز بعد اعتماد السلطة.", "ex": "مينفعش تعين حد في وظيفة غير معتمدة في الجدول.", "test": {"q": "من الذي يعتمد جدول وظائف كل وحدة؟", "a": ["الوزير", "رئيس الجهاز", "المحافظ"], "c": 1}}, {"id": "10", "title": "المجموعات الوظيفية", "sim": "الوظايف متقسمة 4 أنواع: تخصصية، فنية، كتابية، وحرفية.", "text": "4 مجموعات: التخصصية، الفنية، الكتابية، الحرفية والخدمة المعاونة.", "full": "تقسم الوظائف الخاضعة لأحكام هذا القانون إلى المجموعات الوظيفية الرئيسية الآتية: 1 - مجموعة الوظائف التخصصية. 2 - مجموعة الوظائف الفنية. 3 - مجموعة الوظائف الكتابية. 4 - مجموعة الوظائف الحرفية والخدمة المعاونة. وتعتبر كل مجموعة وظيفية وحدة متميزة في مجال التعيين والترقية والنقل والندب والإعارة. وتتكون كل مجموعة وظيفية من مجموعات نوعية، وتنظم اللائحة التنفيذية معايير إنشاء هذه المجموعات النوعية والنقل بين المجموعات المتماثلة.", "reg": "لائحة (24): المجموعة النوعية تضم الوظائف المتماثلة في طبيعة الواجبات، والمؤهل العالي حد أدنى للمجموعات التخصصية، وفوق المتوسط أو المتوسط للفنية والكتابية.\nلائحة (25): يجوز النقل داخل المجموعة الوظيفية الرئيسية مع الاحتفاظ بالأقدمية بين المجموعات النوعية التي تُشغل بمؤهل مناسب أو تتشابه وظائفها في الواجبات، وفق حاجة العمل المرتبطة بالعجز والفائض.", "ex": "المهندس تخصصي، السكرتير كتابي.", "test": {"q": "كم عدد المجموعات الوظيفية الرئيسية؟", "a": ["3 مجموعات", "4 مجموعات", "5 مجموعات"], "c": 1}}, {"id": "11", "title": "طرق شغل الوظائف", "sim": "الوظيفة بتتملي بـ (تعيين، ترقية، نقل، ندب، أو إعارة).", "text": "بالتعيين أو الترقية أو النقل أو الندب أو الإعارة مع استيفاء الشروط.", "full": "يكون شغل الوظائف عن طريق التعيين أو الترقية أو النقل أو الندب أو الإعارة بمراعاة استيفاء شروط شغلها، وذلك بحسب الأحوال المبينة بهذا القانون.", "reg": "لائحة (26): التعيين لازم يكون فيه إعلان مركزي.", "ex": "مدير إدارة ممكن يترقى من الداخل أو يتعين من برة.", "test": {"q": "هل الإعارة تعتبر من طرق شغل الوظائف؟", "a": ["نعم", "لا", "فقط للقياديين"], "c": 0}}, {"id": "12", "title": "التعيين", "sim": "التعيين بيكون بإعلان عام على بوابة الحكومة، وبامتحان.", "text": "بقرار رئيس الجمهورية أو من يفوضه، بإعلان مركزي على بوابة الحكومة (يناير ويونيو، لا تقل مدته عن شهر)، والوظيفة شاغرة ومموّلة، وبامتحان ينفذه الجهاز.", "full": "يكون التعيين بموجب قرار يصدر من رئيس الجمهورية أو من يفوضه، على أساس الكفاءة والجدارة، دون محاباة أو وساطة من خلال إعلان مركزي على موقع بوابة الحكومة المصرية متضمناً البيانات المتعلقة بالوظيفة وشروط شغلها على نحو يكفل تكافؤ الفرص والمساواة بين المواطنين. وفى جميع الأحوال يشترط لشغل الوظائف أن تكون شاغرة وممولة. ويكون التعيين في تلك الوظائف بامتحان ينفذه الجهاز من خلال لجنة للاختيار ويشرف عليه الوزير المختص، على أن يكون التعيين بحسب الأسبقية الواردة في الترتيب النهائي لنتيجة الامتحان، وعند التساوى يقدم الأعلى في مرتبة الحصول على المؤهل المطلوب لشغل الوظيفة، فالدرجة الأعلى في ذات المرتبة، فالأعلى مؤهلاً، فالأقدم في التخرج، فالأكبر سناً. وتحدد اللائحة التنفيذية قواعد الإعلان عن الوظائف الشاغرة وكيفيته، وتشكيل لجنة الاختيار وإجراءات انعقاد الامتحان وكيفيته وقواعد المفاضلة، على أن يكون الإعلان خلال شهري يناير ويونيو من كل سنة عند الحاجة، وألا تقل مدة الإعلان والتقديم عن شهر، وتعلن النتيجة على الموقع الإلكتروني المشار إليه بالفقرة الأولى من هذه المادة.", "reg": "لائحة (26): التعيين من خلال إعلان مركزي. لائحة (29): يراجع الجهاز البيانات المنصوص عليها في لائحتي 27 و28 (حصر الوظائف الشاغرة وذوي الإعاقة) في ضوء الهيكل التنظيمي وجدول الوظائف وبطاقات الوصف والمقررات الوظيفية واحتياجات العمل ومعدلات الأداء، لتقييم احتياج الوحدة، وتُخطر الوحدة بقراره.\nلائحة (31): يعلن الجهاز في 1 يناير و1 يونيو بعد تجميع الاحتياجات قبلها بـ 15 يومًا على الأقل. لائحة (32): الإعلان على البوابة لمدة 15 يومًا على الأقل (ملاحظة: القانون يشترط ألا تقل مدة الإعلان والتقديم عن شهر) مع استمارة التقدم وبيانات الوظيفة والمفاضلة. لائحة (33): التسجيل إلكترونيًا ثم جدول الامتحان خلال أسبوع. لائحة (34-37): لجنة الاختيار برئاسة رئيس الجهاز، والترتيب النهائي بالدرجات؛ وعند التساوي يُقدَّم الأعلى في مرتبة المؤهل المطلوب، فالدرجة الأعلى في ذات المرتبة، فالأعلى مؤهلاً، فالأقدم تخرجًا، فالأكبر سنًا، فالأكثر إلمامًا بلغة الإشارة أو المهارات السلوكية أو اجتياز دورات تدريبية حسب طبيعة كل وحدة. لائحة (38-39): النتيجة المبدئية خلال شهر على الأكثر من تاريخ الامتحان؛ وللمتقدم التظلم للوزير المختص أو الجهاز من عدم إدراج اسمه أو من ترتيبه خلال أسبوعين من إعلان القوائم، بعد سداد الرسم، ويعلن الجهاز نتيجة التظلم على البوابة خلال 30 يومًا من انقضاء الأسبوعين. لائحة (40): يرسل الجهاز للوحدة الترتيب النهائي معتمدًا من الوزير مع المستندات، ولإدارة الموارد البشرية طلب استيفاء أي مستندات بالبريد الإلكتروني وخطاب مسجل، ويُلغى الترشح إن لم تُستوفَ خلال 15 يومًا من الإخطار. لائحة (41): العرض على لجنة الموارد البشرية في أول اجتماع تالٍ، وتعرض اقتراحاتها على السلطة المختصة خلال أسبوع، ويصدر قرار التعيين من رئيس الجمهورية أو من يفوضه. لائحة (42): تُلغى نتيجة من سجّل بيانات أو قدّم أوراقًا مخالفة للأوراق الرسمية. لائحة (43): قائمة انتظار صالحة في حدود العدد الباقي فقط، وتسقط باكتمال التعيين أو بمرور سنة من إعلان النتيجة. لائحة (44): يُعلن قرار التعيين 10 أيام، ويُخطر المُعيَّن فورًا بالبريد الإلكتروني وخطاب مسجل؛ فإن لم يتسلم العمل خلال شهر من تاريخ آخر إخطار اعتُبر القرار كأن لم يكن، إلا بعذر تقبله السلطة خلال 60 يومًا من صدور القرار.", "ex": "الجهاز بيعلن عن وظايف في يناير على البوابة، والتقديم والإعلان مايقلوش عن شهر، والتعيين بترتيب نتيجة الامتحان.", "test": {"q": "أين يتم الإعلان عن الوظائف الشاغرة؟", "a": ["في الصحف المحلية", "على موقع بوابة الحكومة المصرية", "في لوحة إعلانات الوزارة فقط"], "c": 1}}, {"id": "13", "title": "ذوو الإعاقة وأسر الشهداء", "sim": "لازم 5% من الوظايف تكون لذوي الإعاقة، وفيه وظايف لأسر الشهداء.", "text": "5% من وظائف كل وحدة لذوي الإعاقة.", "full": "تلتزم كل وحدة بتخصيص نسبة خمسة في المائة من مجموع الوظائف بها للأشخاص ذوى الإعاقة. وتحدد بقرار من رئيس مجلس الوزراء الوظائف التي تحجز للمصابين في العمليات الحربية، ومصابى الثورة والمحاربين القدماء ومصابى العمليات الأمنية متى سمحت حالتهم بالقيام بأعمالها وذلك وفقاً للقواعد التي يحددها هذا القرار، على أن تلتزم الوحدة بتعيين هذه النسبة وفقاً لاحتياجاتها. كما يجوز أن يعين في هذه الوظائف أزواج الفئات المنصوص عليها في الفقرة السابقة أو أحد أولادهم أو أحد والديهم أو أحد إخوتهم، القائمين بإعالتهم، وذلك في حالة عجزهم عجزاً تاماً أو وفاتهم، إذا توافرت فيهم شروط شغل هذه الوظائف، وكذلك الأمر بالنسبة لأسر الشهداء والمفقودين في العمليات الحربية وأسر شهداء العمليات الأمنية.", "reg": "لائحة (28): عند كل تعيين تُستوفى النسبة المقررة لذوي الإعاقة الحاصلين على شهادات التأهيل، على ألا يمضي على صدور الشهادة أكثر من عام. وعلى الوحدة حصر مسميات الوظائف المزمع تعيينهم عليها ومستوياتها ومجموعاتها، ويُرسل البيان للجهاز بعد اعتماد السلطة.\nلائحة (106): تنقل الوحدة الموظف من ذوي الإعاقة بناءً على طلبه إلى أقرب مكان عمل من محل إقامته ما دامت توجد وظيفة تناسب حالته.", "ex": "لو الوزارة عندها 200 وظيفة، لازم 10 لذوي الإعاقة.", "test": {"q": "ما هي النسبة المخصصة لذوي الإعاقة من مجموع الوظائف؟", "a": ["2%", "5%", "10%"], "c": 1}}, {"id": "14", "title": "شروط التعيين", "sim": "لازم تكون مصري (أو من دولة عربية بتعامل المصريين بالمثل)، سمعتك حلوة، مفيش عليك حكم جناية أو جريمة مخلة بالشرف، صحتك كويسة، وسنك 18+، وتنجح في الامتحان.", "text": "جنسية مصرية أو عربية بالمثل • محمود السيرة • لا حكم جناية أو جريمة مخلة بالشرف ما لم يُرد اعتباره • لا فصل تأديبي إلا بعد 4 سنوات • لياقة صحية • استيفاء الاشتراطات واجتياز الامتحان • سن 18.", "full": "يُشترط فيمن يعين في إحدى الوظائف ما يأتى: 1 - أن يكون متمتعًا بالجنسية المصرية أو جنسية إحدى الدول العربية التي تعامل المصريين بالمثل في تولى الوظائف المدنية. 2 - أن يكون محمود السيرة، حسن السمعة. 3 - ألا يكون قد سبق الحكم عليه بعقوبة جناية أو بعقوبة مقيدة للحرية في جريمة مخلة بالشرف أو الأمانة ما لم يكن قد رُدُ إليه اعتباره. 4 - ألا يكون قد سبق فصله من الخدمة بحكم أو قرار تأديبى نهائى، ما لم تمض على صدوره أربع سنوات على الأقل. 5 - أن تثبت لياقته الصحية لشغل الوظيفة بشهادة تصدر من المجلس الطبي المختص. 6 - أن يكون مستوفياً لاشتراطات شغل الوظيفة. 7 - أن يجتاز الامتحان المقرر لشغل الوظيفة. 8 - ألا تقل سنه عن ثمانية عشر عاماً ميلادياً.", "reg": "لائحة (45): يقدم المرشح: بطاقة الرقم القومي أو جواز السفر، صحيفة الحالة الجنائية، إقرارًا موقعًا أمام مدير الموارد البشرية ومصدقًا على التوقيع بعدم سبق فصله بقرار أو حكم تأديبي نهائي خلال 4 سنوات، قرار المجلس الطبي بثبوت اللياقة الصحية متضمنًا الكشف الطبي وتحليل المخدرات، شهادة الميلاد المميكنة، أصل المؤهل، شهادة تأدية الخدمة العسكرية أو الإعفاء (للذكور) أو العامة (للإناث)، إقرار الحالة الاجتماعية، إقرار الذمة المالية، وأي مستندات تطلبها السلطة.", "ex": "عمره 17 سنة مينفعش.", "test": {"q": "ما هو الحد الأدنى لسن التعيين في الوظائف المدنية؟", "a": ["16 سنة", "18 سنة", "21 سنة"], "c": 1}}, {"id": "15", "title": "فترة الاختبار", "sim": "أول 6 شهور تجربة، لو مش عاجبينه بيمشوه.", "text": "6 أشهر، فإن ثبت عدم الصلاحية أُنهيت الخدمة.", "full": "يُوضع المعين لأول مرة تحت الاختبار لمدة ستة أشهر من تاريخ تسلمه العمل تتقرر خلالها مدى صلاحيته للعمل، فإذا ثبت عدم صلاحيته أنهيت خدمته، وتحدد اللائحة التنفيذية أحوال وإجراءات عدم الصلاحية. ولا يجوز نقل أو ندب أو إعارة المعين خلال فترة الاختبار. ولا تسرى أحكام هذه المادة على شاغلى الوظائف القيادية والإدارة الإشرافية.", "reg": "لائحة (46): سجل لقيد الموظفين تحت الاختبار تُوضح فيه بداية ونهاية الفترة.\nلائحة (47): تقارير شهرية بمعرفة الرئيس المباشر ويعتمدها الرئيس الأعلى، تُسلَّم صورة منها للموظف شهريًا موضحًا بها أوجه القصور وكيفية معالجتها وهل تفاداها، ويوقع بالعلم والاستلام ويُودع الأصل بملف خدمته (وإن رفض التوقيع يُؤشَّر على الأصل بذلك)، ويُوضع تقرير نهائي آخر الفترة يُعرض على لجنة الموارد البشرية.\nلائحة (48): تنتهي الخدمة لعدم الصلاحية إذا: حصل على تقرير أداء أقل من فوق المتوسط، أو لم يجتز التدريب دون عذر مقبول، أو تغيب دون إذن أو عذر مقبول 5 أيام متصلة أو 10 متقطعة خلال فترة الاختبار. ويصدر القرار من السلطة المختصة.", "ex": "اتعين 1 يناير، لحد 30 يونيو تحت الاختبار.", "test": {"q": "كم تبلغ مدة فترة الاختبار للموظف الجديد؟", "a": ["3 أشهر", "6 أشهر", "سنة"], "c": 1}}, {"id": "16", "title": "التعاقد", "sim": "بنستعين بخبراء (خبرة 10 سنين) لو مفيش حد عندنا.", "text": "في الضرورة مع ذوي الخبرات النادرة: خبرة 10 سنوات، مدة لا تتجاوز 3 سنوات.", "full": "يجوز التعاقد في حالات الضرورة مع ذوى خبرات في التخصصات النادرة وفقًا للشروط والضوابط الآتية: 1 - ألا يوجد بالوحدة والأجهزة التابعة لها من يملك خبرة مماثلة في التخصص المطلوب ويمكن الاستعانة به. 2 - ألا تقل خبرة المتعاقد معه في التخصص المطلوب عن عشر سنوات. 3 - عدم الإخلال بالحد الأقصى للدخول. 4 - أن يكون التعاقد لمدة أو لمدد لا تجاوز ثلاث سنوات. 5 - أن يكون التعاقد بموافقة رئيس مجلس الوزراء، بناءً على عرض الوزير المختص.", "reg": "لائحة (49): يجوز التعاقد في حالات الضرورة مع ذوي الخبرات في التخصصات النادرة للتحقق من توفر الشروط المقررة قانونًا، وبموافقة رئيس مجلس الوزراء بناءً على عرض الوزير المختص.\nلائحة (50): يصدر نموذج التعاقد بقرار من الوزير المختص بعد دراسة الجهاز.", "ex": "تعاقد مع خبير ذكاء اصطناعي خبرة 15 سنة.", "test": {"q": "ما هو الحد الأدنى لسنوات الخبرة المطلوبة للتعاقد مع الخبراء؟", "a": ["5 سنوات", "10 سنوات", "15 سنة"], "c": 1}}, {"id": "17", "title": "التعيين في القيادية", "sim": "المناصب القيادية بمسابقة واختيار من لجنة، ومدة شغل الوظيفة 3 سنين.", "text": "بمسابقة تُعلن، وعن طريق لجنة اختيار لمدة 3 سنوات تُجدد 3 سنوات.", "full": "يكون التعيين في الوظائف القيادية والإدارة الإشرافية عن طريق مسابقة يعلن عنها على موقع بوابة الحكومة المصرية أو النشر في جريدتين واسعتى الانتشار متضمنًا البيانات المتعلقة بالوظيفة. ويكون التعيين من خلال لجنة للاختيار لمدة أقصاها ثلاث سنوات، يجوز تجديدها بحد أقصى ثلاث سنوات، بناءً على تقارير تقويم الأداء، وذلك دون الإخلال بباقى الشروط اللازمة لشغل هذه الوظائف. ويشترط للتعيين في هذه الوظائف التأكد من توفر صفات النزاهة من الجهات المعنية، على أن يستند الرأى بعدم توفرها إلى قرائن كافية، وأسباب جدية، واجتياز التدريب اللازم. ويحدد الجهاز مستوى البرامج التدريبية المتطلبة والجهات المعتمدة لتقديم هذه البرامج. وتحدد اللائحة التنفيذية إجراءات وقواعد اختيار شاغلي هذه الوظائف وتشكيل لجنة الاختيار والإعداد والتأهيل اللازمين لشغلها وإجراءات تقويم نتائج أعمال شاغليها. واستثناءً من أحكام هذا القانون يجوز للوزراء اختيار مساعدين ومعاونين لهم لمدة محددة وفقًا للنظام الذي يصدر به قرار من رئيس مجلس الوزراء بناءً على عرض الوزير المختص واقتراح الجهاز، على أن يتضمن هذا النظام على الأخص قواعد اختيار وتقويم أداء هؤلاء والمعاملة المالية المقررة لهم.", "reg": "لائحة (51): تعد إدارة الموارد البشرية شهريًا بيانًا بالوظائف القيادية والإشرافية الخالية أو المتوقع خلوها خلال 6 أشهر متضمنًا مسمياتها ومستوياتها وشروط شغلها، وتعرضه على السلطة المختصة لاتخاذ إجراءات الإعلان.\nلائحة (52): تعلن كل وحدة عن الوظائف القيادية والإشرافية الحالية أو المتوقع خلوها خلال 6 أشهر، متضمنًا الإعلان المسمى والمستوى الوظيفي ووصفًا موجزًا والشروط والقدرات اللازمة ومدة تلقي الطلبات والجهة التي تقدم إليها، على ألا تقل مدة الإعلان وتلقي الطلبات عن شهر، ويتقدم العاملون بالوحدة وغيرهم.\nلائحة (53): لجنة للوظائف القيادية والإشرافية (ويجوز لجنة مستقلة لكل منهما) برئاسة السلطة المختصة أو من تحدده وعضوية ستة من الخبراء والمتخصصين في مجالات الوظائف المعلن عنها والإدارة والموارد البشرية وتكنولوجيا المعلومات والقانون، نصفهم من خارج الوحدة. وتختص بتقييم المتقدمين والاختيار من بينهم، والنظر في تقويم أداء الشاغلين عند التجديد. وتستعين بالجهات المعنية للتأكد من النزاهة، ويستند الرأي بعدم توفرها إلى قرائن كافية وأسباب جدية، ولها الاستعانة بمن تراه دون صوت معدود. لائحة (54): للجنة أمانة فنية بقرار من السلطة المختصة، تتلقى طلبات المتقدمين وتعد كشوفًا مقارنة ببياناتهم لعرضها على اللجنة.\nلائحة (55): يستوفي المتقدم شروط الوظيفة وفق بطاقة الوصف، ويرفق المستندات الدالة على مستوى المهارات والقدرات وإنجازاته السابقة، ويقدم مقترحًا وافيًا لتطوير الوحدة أو أحد أنشطتها الرئيسية يتضمن أهدافًا محددة زمنيًا وقابلة للقياس والتطبيق ووسائل تحقيقها في حدود الإمكانيات المتاحة، وفق النموذج الذي يضعه الجهاز ويصدر به قرار من الوزير المختص، وتوفر الأمانة الفنية لهم كل البيانات اللازمة.\nلائحة (56): التقييم على 4 معايير بـ 25 درجة لكل معيار: القدرات العلمية (الدرجات العلمية، إجادة لغات أجنبية، التعامل مع الحاسب، المؤتمرات والبحوث)، والتاريخ الوظيفي (تقارير الأداء، الإنجازات، سابقة أعمال مماثلة)، والمقترح التطويري، والسمات الشخصية (القيادة، اتخاذ القرار، الإبداع، حل المشكلات وإدارة الأزمات، الاتصال والإقناع والعرض)، وبحد أدنى 70% في كل معيار، وعند التساوي يرجح الأصغر سنًا.\nلائحة (57): قائمة نهائية بالمرشحين بعد التأكد من النزاهة وحسن السمعة وتُرسل لرئيس الجمهورية أو من يفوضه لإصدار القرار.\nلائحة (58): يقدم الشاغل تقريرًا سنويًا عن إنجازاته مرفقًا به صورة من المقترحات التي قدمها عند شغل الوظيفة إلى الأمانة الفنية، التي توزعه على أعضاء اللجنة لدراسته؛ وترفع اللجنة تقريرها وملاحظاتها للسلطة المختصة عند انتهاء مدة الشغل لتقرر التجديد أو النقل إلى وظيفة أخرى. لائحة (59): يضع الجهاز برامج متكاملة لتنمية خبرات ومهارات شاغلي الوظائف القيادية والإشرافية حسب مستوى كل منها.", "ex": "لازم تجيب 70% في كل معيار.", "test": {"q": "ما هي مدة شغل الوظيفة القيادية (قبل التجديد)؟", "a": ["سنتين", "3 سنوات", "4 سنوات"], "c": 1}}, {"id": "18", "title": "الوكيل الدائم", "sim": "كل وزارة ليها وكيل دائم لمدة 4 سنين، بيتجدد 4 كمان.", "text": "وظيفة وكيل دائم لكل وزارة، مدتها 4 سنوات تُجدد 4 سنوات أخرى.", "full": "تُنشأ بكل وزارة وظيفة واحدة لوكيل دائم للوزارة بالمستوى الممتاز لمعاونة الوزير في مباشرة اختصاصاته. واستثناءً من أحكام المادة (17) من هذا القانون يختار الوزير الوكيل الدائم من خلال لجنة للاختبار وذلك لمدة أقصاها أربع سنوات، يجوز تجديدها بحد أقصى أربع سنوات أخرى، يكلف خلالها بضمان الاستقرار التنظيمى والمؤسسى للوزارة والهيئات والأجهزة التابعة لها، ورفع مستوى كفاءة تنفيذ سياساتها، واستمرارية البرامج والمشروعات والخطط، ومتابعتها تحت إشراف الوزير. وتحدد اللائحة التنفيذية قواعد وضوابط اختيار الوكيل الدائم.", "reg": "لائحة (60): يعاون الوكيل الدائم الوزير في مباشرة اختصاصاته، ويضمن الاستقرار التنظيمي والمؤسسي للوزارة والهيئات والأجهزة التابعة لها، ويرفع كفاءة تنفيذ سياساتها، ويضمن استمرارية البرامج والمشروعات والخطط تحت إشراف الوزير.\nلائحة (61): تعلن الوزارة عن وظيفة الوكيل الدائم الحالية أو المتوقع خلوها خلال 6 أشهر، متضمنًا الإعلان وصفًا موجزًا للوظيفة والشروط والقدرات اللازمة لشغلها والمدة المحددة لتلقي الطلبات والجهة التي تقدم إليها، على ألا تقل مدة الإعلان وتلقي الطلبات عن شهر.\nلائحة (62): تقيّم اللجنة المتقدمين وفق معايير لائحة (56)، وترشح أعلى الدرجات بما لا يجاوز 3 (بحد أدنى 70% في كل معيار) ويختار الوزير من بينهم، ويصدر قرار التعيين من رئيس الجمهورية أو من يفوضه لمدة أقصاها 4 سنوات قابلة للتجديد لمدة واحدة.\nلائحة (63): تسري لوائح (55 و58 و64 و65) على الوكيل الدائم.", "ex": "الوكيل الدائم بيضمن استقرار الوزارة.", "test": {"q": "كم مدة شغل وظيفة الوكيل الدائم؟", "a": ["3 سنوات", "4 سنوات", "5 سنوات"], "c": 1}}, {"id": "19", "title": "اليمين", "sim": "القيادي لازم يحلف اليمين قبل ما يبدأ شغل.", "text": "من يعين بوظيفة قيادية يؤدي اليمين أمام السلطة المختصة.", "full": "يؤدى كل موظف يعين في وظيفة من الوظائف القيادية أمام السلطة المختصة، وقبل أن يباشر عمله اليمين الآتية: «أقسم بالله العظيم أن أحترم الدستور والقانون وأن أخدم الدولة، وأن أحافظ على المال العام، وأن أؤدى واجباتى الوظيفية بنزاهة وشفافية وبروح فريق العمل وعلى الوجه الأكمل لخدمة الشعب».", "reg": "لا توجد مادة في اللائحة بشأن اليمين.", "ex": "مدير عام جديد مينفعش يمضي أوراق قبل اليمين.", "test": {"q": "من الذي يؤدي اليمين قبل مباشرة العمل؟", "a": ["كل الموظفين الجدد", "شاغلو الوظائف القيادية فقط", "العمال"], "c": 1}}, {"id": "20", "title": "انتهاء مدة القيادية", "sim": "لما مدة القيادي تخلص، بيشغل وظيفة تانية مستواها مش أقل من الوظيفة اللي كان فيها، ولو عايز يسيب الخدمة يطلب ده خلال 30 يوم.", "text": "تنتهي بانقضاء مدتها، ويشغل وظيفة لا يقل مستواها عن مستواه السابق، وله خلال 30 يومًا طلب إنهاء خدمته بتسوية تأمينية (مدة الاشتراك + 5 سنوات أو المدة الباقية أيهما أقل).", "full": "تنتهى مدة شغل الوظائف القيادية والإدارة الإشرافية بانقضاء المدة المحددة في قرار شغلها ما لم يصدر قرار بتجديدها، وبانتهاء هذه المدة يشغل الموظف وظيفة أخرى لا يقل مستواها عن مستوى الوظيفة التي كان يشغلها إذا كان من موظفي الدولة قبل شغله لإحدى هذه الوظائف. ويجوز للموظف خلال الثلاثين يومًا التالية لانتهاء مدة شغله لإحدى الوظائف المشار إليها طلب إنهاء خدمته، وفى هذه الحالة تسوى حقوقه التأمينية على أساس مدة اشتراكه في التأمين الاجتماعى مضافًا إليها مدة خمس سنوات أو المدة الباقية لبلوغه السن المقررة قانونًا لترك الخدمة أيهما أقل. ويعامل فيما يتعلق بالمعاش الذي يستحقه في وظيفته السابقة معاملة من تنتهي خدمته ببلوغ هذه السن. وتتحمل الخزانة العامة للدولة الزيادة في الحقوق التأمينية الناتجة عن تطبيق هذه المادة. ويجب أن تتخذ الإجراءات اللازمة لتجديد مدة شغل الوظيفة القيادية والإدارة الإشرافية أو النقل منها طبقًا للأحكام السابقة قبل انتهاء المدة المحددة لشغل الوظيفة بستين يومًا على الأقل.", "reg": "لائحة (64): يصدر قرار تجديد المدة قبل انتهائها بـ 15 يومًا على الأقل. وإذا كان الشاغل من موظفي الدولة وانتهت مدته دون تجديد يُنقل إلى وظيفة شاغرة وممولة لا يقل مستواها، فإن لم توجد تُتخذ إجراءات استحداثها وتمويلها ويُلغى التمويل بخلوها من شاغلها، وإذا كان من غير موظفي الدولة تنتهي خدمته. (ملاحظة للمقارنة: القانون يشترط اتخاذ إجراءات التجديد أو النقل قبل انتهاء المدة بـ 60 يومًا على الأقل، واللائحة تتحدث عن صدور قرار التجديد قبلها بـ 15 يومًا.)\nلائحة (65): يُخطر الشاغل بعدم التجديد، وله خلال 30 يومًا طلب إنهاء خدمته، وتعرض إدارة الموارد البشرية طلبه فورًا ويجب إجابته ما لم يوجد مانع قانوني، وتعد بيانًا بأجره ومدة خدمته وتاريخ بلوغه السن القانونية لتسوية حقوقه التأمينية.\nلائحة (190): إذا انتهت مدة شغل إحدى الوظائف القيادية وكان شاغلها من المعينين قبل العمل بالقانون يُنقل إلى وظيفة أخرى شاغرة وممولة لا يقل مستواها عن مستوى الوظيفة القيادية التي كان يشغلها.", "ex": "مدير عام خلصت مدته، رجع خبير.", "test": {"q": "إذا انتهت مدة القيادي دون تجديد، ماذا يحدث؟", "a": ["تنتهي خدمته", "يشغل وظيفة لا تقل عن مستواه السابق", "يعين في وظيفة أدنى"], "c": 1}}, {"id": "21", "title": "الجهات ذات الطبيعة الخاصة", "sim": "في جهات معينة ليها طبيعة خاصة، ليها قوانين تانية.", "text": "لا تسري عليها المادتان 17 و20. التعيين بقرار رئيس الجمهورية.", "full": "لا تسرى أحكام المادتين (17، 20) من هذا القانون على الجهات والوظائف ذات الطبيعة الخاصة التي يصدر بتحديدها قرار من رئيس الجمهورية، ويكون التعيين في الوظائف القيادية والإدارة الإشرافية في هذه الجهات والوظائف بقرار من رئيس الجمهورية أو من يفوضه. ويكون شغل هذه الوظائف عن طريق الترقية بالاختيار وذلك على أساس بيانات تقويم الأداء وما ورد في ملف الخدمة من عناصر الامتياز.", "reg": "لا توجد مادة مقابلة.", "ex": "الهيئات الاقتصادية.", "test": {"q": "هل تسري المادتان 17 و20 على الجهات ذات الطبيعة الخاصة؟", "a": ["نعم", "لا", "تسري المادة 17 فقط"], "c": 1}}, {"id": "22", "title": "الأقدمية", "sim": "الأقدمية من تاريخ شغلك للوظيفة.", "text": "من تاريخ شغل الوظيفة. عند الاتحاد: بالأسبقية في التعيين.", "full": "تعتبر الأقدمية في الوظيفة من تاريخ شغلها، فإذا اتحد تاريخ شغل الوظيفة لأكثر من موظف اعتبرت الأقدمية وفقًا لما يأتى: 1 - إذا كان شغل الوظيفة لأول مرة اعتبرت الأقدمية بحسب الأسبقية في التعيين طبقًا لما ورد في المادة (12) من هذا القانون. 2 - إذا كان شغل الوظيفة بطريق الترقية اعتبرت الأقدمية على أساس الأقدمية في الوظيفة السابقة.", "reg": "لائحة (97): تُرتَّب الأقدمية بين الموظفين الذين يُرقَّون في تاريخ واحد طبقًا لأقدميتهم في مستواهم الوظيفي السابق.", "ex": "اتعينوا في نفس اليوم، الأقدم اللي اتكتب الأول.", "test": {"q": "من تاريخ أي شيء تُحسب الأقدمية في الوظيفة؟", "a": ["تاريخ التخرج", "تاريخ شغل الوظيفة", "تاريخ التقديم"], "c": 1}}, {"id": "23", "title": "المؤهل الأعلى", "sim": "لو معاك مؤهل أعلى، ممكن تقدم لوظيفة أعلى في نفس مصلحتك.", "text": "يجوز للحاصلين على مؤهل أعلى التقدم للوظائف الخالية.", "full": "مع عدم الإخلال بأحكام المادة (76) من هذا القانون، يجوز للموظفين الحاصلين على مؤهلات أعلى قبل الخدمة أو أثنائها، التقدم للوظائف الخالية بالوحدات التي يعملون بها، أو غيرها من الوحدات، متى كانت تلك المؤهلات متطلبة لشغلها، وبشرط استيفائهم الشروط اللازمة لشغل هذه الوظائف.", "reg": "لا توجد مادة مقابلة مباشرة. (لائحة 189 تنظم إعادة تعيين الحاصل على مؤهل أعلى وفق المادة 76 من القانون، ومن شروطها: عدم طلب الإعلان عن الوظيفة التي خلت بإعادة التعيين لمدة 3 سنوات.)", "ex": "موظف جاب ماجستير، قدم لوظيفة تطلب ماجستير.", "test": {"q": "هل يجوز للموظف الحاصل على مؤهل أعلى التقدم لوظائف أعلى؟", "a": ["نعم", "لا", "فقط بعد 5 سنوات"], "c": 0}}, {"id": "24", "title": "الأقارب", "sim": "ممنوع تشتغل تحت رئاسة مباشرة لقريب ليك من الدرجة الأولى.", "text": "لا يجوز أن يعمل موظف تحت رئاسة مباشرة لأحد أقاربه من الدرجة الأولى.", "full": "لا يجوز بأية حال من الأحوال أن يعمل موظف تحت الرئاسة المباشرة لأحد أقاربه من الدرجة الأولى في ذات الوحدة، وتحدد اللائحة التنفيذية الإجراءات الواجب اتخاذها عند توافر هذه الحالة.", "reg": "لائحة (66): على الموظف الذي يتوفر في شأنه هذا الحظر إخطار السلطة المختصة خلال 15 يومًا وإلا جوزي تأديبيًا. ويُخيَّر بين النقل إلى وظيفة أخرى داخل الوحدة أو خارجها، فإن لم يستجب خلال شهر من تاريخ تخييره يُنقل إلى وظيفة لا يقل مستواها عن مستوى وظيفته الأصلية دون طلب منه.", "ex": "أبوك رئيس قسم، مينفعش تشتغل موظف تحته.", "test": {"q": "هل يجوز العمل تحت الرئاسة المباشرة لقريب من الدرجة الأولى؟", "a": ["نعم", "لا", "بشرط موافقة الوزير"], "c": 1}}, {"id": "25", "title": "تقويم الأداء", "sim": "تقييم شغلك بيكون مرتين في السنة، من ممتاز لضعيف.", "text": "مرتان على الأقل في السنة. المراتب: ممتاز، كفء، فوق المتوسط، متوسط، ضعيف.", "full": "تضع السلطة المختصة نظامًا يكفل تقويم أداء الموظف بالوحدة بما يتفق وطبيعة نشاطها وأهدافها ونوعية وظائفها. ويكون تقويم أداء الموظف عن سنة مالية على مرتين على الأقل قبل وضع التقرير النهائي. ويقتصر تقويم الأداء على القائمين بالعمل فعلاً بالوحدة مدة ستة أشهر على الأقل. ويكون الأداء العادي هو الأساس المعول عليه في تقويم أداء الموظفين بما يحقق أهداف الوحدة ونشاطها ونوعية الوظائف بها. ويكون تقويم الأداء بمرتبة ممتاز، أو كفء، أو فوق المتوسط، أو متوسط، أو ضعيف. وتُحدد اللائحة التنفيذية ضوابط وإجراءات التقويم بما يكفل الحيادية والدقة في القياس وصولًا للمنحنى الطبيعي للأداء، وكذا ميعاد وضع تقارير التقويم وكيفية اعتمادها والتظلم منها ومعادلة هذه المراتب بالمراتب المعمول بها في تاريخ العمل بهذا القانون. ويقدر تقويم أداء الموظف الذي لم يقم بالعمل فعليًا بالوحدة لمدة ستة أشهر على الأقل بسبب التجنيد أو الاستدعاء للاحتياط أو الاستبقاء، أو للمرض، أو لإجازة رعاية الطفل، أو لعضوية أحد المجالس النقابية، أو لعضوية مجلس النواب، بمرتبة كفء حكمًا، فإذا كان تقويم أدائه في العام السابق بمرتبة ممتاز يقدر بمرتبة ممتاز حكمًا.", "reg": "لائحة (67-68): السلطة المختصة تضع نظام التقويم بمحور أو أكثر: تقويم الموظف لذاته، ومن مرؤوسيه، ومن رئيسه المباشر، ومن زملائه في إدارته، ومن جمهور المتعاملين، والأداء العام للوحدة؛ بمعايير موضوعية (السلوك، الالتزام، الجودة، التميز، الإبداع، الإنجاز، تحمل المسئولية)، ويُضاف للقياديين والإشرافيين: التخطيط والتنظيم، الإشراف والرقابة والتوجيه، إدارة الأزمات، اتخاذ القرار، النتائج المحققة؛ وفق دليل إرشادي بقرار الوزير المختص بعد رأي الجهاز، وللسلطة وضع الوزن النسبي لمؤشرات كل معيار.\nلائحة (69): تعد الموارد البشرية نموذج تقويم الأداء ولا يُعد نافذًا إلا بعد اعتماد السلطة المختصة، ولا يُعدَّل إلا بعد 3 سنوات على الأقل أو بموافقة الجهاز، ويُعلن فور اعتماده على موقع الوحدة ولوحة الإعلانات.\nلائحة (70-72): سجل أداء وظيفي يدون فيه الرئيس المباشر كل 3 أشهر ملاحظاته (إيجابيات وسلبيات) والمخالفات وما اتُّخذ بشأنها، ويكون أساسًا للبت في التظلمات؛ ويُخطر الموظف أولًا بأول بما يؤخذ عليه من إهمال أو تقصير ليعمل على إزالة أسبابه ويُوثَّق ذلك بالسجل؛ وفي الربع الأخير من السنة يدعو كل مرؤوسيه لوضع أهداف ومعدلات الأداء للسنة التالية وتُرسل صورة منها للموارد البشرية.\nلائحة (73): توزع الموارد البشرية نماذج التقويم في الأسبوع الأخير من أكتوبر وأبريل وتُعاد بعد استيفائها بحد أقصى نهاية نوفمبر ومايو؛ ويُقوَّم الموظف مرتين في النصف الأول من نوفمبر ومايو ويعتمدهما الرئيس الأعلى في النصف الثاني من الشهرين؛ والتقرير السنوي في يونيو بمتوسط الدرجتين.\nلائحة (74): ضوابط التقدير: واقعية وموضوعية التقييم والدقة التامة في قياس الأداء والسلوك، وحيادية التقييم والتجرد من العلاقات الشخصية، والوصول للمنحنى الطبيعي للأداء، ومعدل الأداء المحدد لكل وظيفة.\nلائحة (75): ممتاز 90 إلى 100، كفء 80 لأقل من 90، فوق المتوسط 65 لأقل من 80، متوسط 50 لأقل من 65، ضعيف أقل من 50.\nلائحة (76): معادلة المراتب: ممتاز = ممتاز، كفء = جيد جدًا، فوق المتوسط = جيد، متوسط = متوسط، ضعيف = ضعيف (مقابل تقارير الكفاية في قانون 47 لسنة 1978).\nلائحة (77): يُرتَّب الموظفون في كل تقسيم تنظيمي تنازليًا بدرجات تقارير الأداء لتحديد المراتب وصولًا للمنحنى الطبيعي.\nلائحة (78): لا يجوز تقويمه ممتاز إذا وُقع عليه خلال سنة التقرير خصم أجر لمدة أو مدد تزيد على 3 أيام أو جزاء أشد، أو كان من القياديين/الإشرافيين ووُقع عليه أي جزاء، أو أُتيحت له فرصة التدريب وتخلف عنه دون عذر مقبول أو لم يجتزه بنجاح.\nلائحة (79): عند النقل تُعد الجهة المنقول منها تقريرًا عن أدائه خلال مدة عمله بها وترسله للجهة المنقول إليها للاسترشاد به؛ وعند الندب تضع الوحدة التي قضى بها المدة الأكبر من السنة التقرير النهائي، وعند تساوي المدتين ترسل الجهة المنتدب منها تقرير أدائه للجهة المنتدب إليها للاعتداد به.\nلائحة (81): التظلم من التقرير خلال 15 يومًا من الإعلان به.\nلائحة (85): تُودع تقارير الأداء النهائية بملفات خدمة الموظفين للرجوع إليها عند اللزوم.\nلائحة (86): تعلن أسماء من حصلوا على ممتاز على موقع الوحدة ولوحة الإعلانات وفي مكان بارز بكل إدارة، ولا يُرفع الإعلان إلا بعد 15 يومًا.\nلائحة (191): يُقوَّم أداء الموظف عن الفترة من 2017/1/1 حتى 2017/6/30 وفق الأحكام والقواعد والإجراءات المقررة قبل العمل بالقانون.", "ex": "جبت 85 يبقى كفء، جبت 92 يبقى ممتاز.", "test": {"q": "كم مرة يتم تقويم أداء الموظف في السنة المالية؟", "a": ["مرة واحدة", "مرتين على الأقل", "3 مرات"], "c": 1}}, {"id": "26", "title": "التظلم من التقرير", "sim": "لو تقييمك ظلم، ممكن تتظلم خلال 15 يوم.", "text": "تُعلن إدارة الموارد التقرير، وله التظلم خلال 15 يومًا.", "full": "تُعلن إدارة الموارد البشرية الموظف بصورة من تقرير تقويم أدائه بمجرد اعتماده من السلطة المختصة. وله أن يتظلم منه خلال خمسة عشر يوماً من تاريخ إعلانه. ويكون تظلم الموظفين شاغلى الوظائف القيادية والإدارة الإشرافية من التقارير المقدمة عن أدائهم إلى السلطة المختصة. ويكون تظلم باقى الموظفين إلى لجنة تظلمات، تنشأ لهذا الغرض، وتُشكل بقرار من السلطة المختصة من ثلاثة من شاغلى الوظائف القيادية، وعضو تختاره اللجنة النقابية بالوحدة إن وُجدت. ويُبَت فى التظلم خلال ستين يوماً من تاريخ تقدميه. ويجب على إدارة الموارد البشرية إعلان الموظف بنتيجة تظلمه والأسباب التي بُني عليها، ويكون قرار السلطة المختصة أو اللجنة نهائيًا، وذلك مع عدم الإخلال بحقه في التقاضي. ولا يُعتبر تقرير تقويم الأداء نهائيًا إلا بعد انقضاء ميعاد التظلم منه أو البت فيه. وتحدد اللائحة التنفيذية كيفية إعلان الموظف بتقرير تقويم الأداء ونتيجة التظلم منه.", "reg": "لائحة (80): تعلن إدارة الموارد البشرية الموظف إلكترونيًا أو ورقيًا بصورة من تقرير تقويم أدائه خلال 15 يومًا من اعتماده من السلطة المختصة، وفي حالة الإعلان الورقي وامتناعه عن الاستلام والتوقيع يُؤشر على أصل التقرير بذلك.\nلائحة (81): للموظف التظلم خلال 15 يومًا من الإعلان، وعلى النموذج المعد لذلك. وتظلم القياديين للسلطة المختصة، وباقي الموظفين للجنة التظلمات. وتمسك الموارد البشرية سجلًا لقيد التظلمات وتسلم المتظلم صورة من تظلمه بعد التأشير عليها بما يفيد تسلم الأصل.\nلائحة (82-83): للجنة أمين تختاره السلطة المختصة من موظفي الموارد البشرية يتلقى التظلمات ويقيدها بالسجل حسب أسبقية ورودها، ومداولاتها سرية، ولها طلب البيانات من الموظف أو رئيسه، وتراجع سجل أدائه عن السنة السابقة، ويصدر قرارها مسببًا بالأغلبية وعند التساوي يرجح الجانب الذي منه الرئيس.\nلائحة (84): تعلن الموارد البشرية الموظف إلكترونيًا أو ورقيًا بنتيجة التظلم وأسبابها خلال 15 يومًا من البت فيه، وإن امتنع عن الاستلام والتوقيع في الإعلان الورقي يُؤشر على أصل التقرير بذلك.", "ex": "استلمت تقرير غير عادل، قدم تظلم في 15 يوم.", "test": {"q": "ما هي المدة المسموح بها للتظلم من تقرير الأداء؟", "a": ["7 أيام", "15 يوماً", "30 يوماً"], "c": 1}}, {"id": "27", "title": "الضعيف مرتين", "sim": "لو جبت ضعيف مرتين ورا بعض، بيتنقل لوظيفة تانية، ولو استمريت بيخصموا ويمشوك.", "text": "نقله لوظيفة ملائمة سنة، ثم خصم 50% من الأجر المكمل 6 أشهر، ثم إنهاء الخدمة.", "full": "يُعرض أمر الموظف الذي يُقدم عنه تقريران سنويان متتاليان بمرتبة ضعيف على لجنة الموارد البشرية، لنقله لوظيفة أخرى ملائمة في ذات مستوى وظيفته لمدة سنة. وإذا تبين للجنة بعد انقضاء المدة المشار إليها في الفقرة السابقة أنه غير صالح للعمل بها بطريقة مرضية، اقترحت خصم (50%) من الأجر المكمل لمدة ستة أشهر. وإذا تبين بعدها أنه غير صالح للعمل، اقترحت اللجنة إنهاء خدمته لعدم الصلاحية للوظيفة مع حفظ حقوقه التأمينية. وفى جميع الأحوال ترفع اللجنة تقريرها للسلطة المختصة لاعتماده.", "reg": "لائحة (87): إذا قُدِّر أداء الموظف بضعيف تلحقه الموارد البشرية في أقرب وقت، وبعد التنسيق مع رئيسه المباشر، ببرنامج تأهيلي لتحسين أدائه.", "ex": "ضعيف مرتين، اتنقل لوظيفة تانية واتدرب.", "test": {"q": "ماذا يحدث إذا حصل الموظف على تقريرين متتاليين بمرتبة 'ضعيف'؟", "a": ["يتم إنذاره", "يتم نقله لوظيفة ملائمة", "يتم فصله فوراً"], "c": 1}}, {"id": "28", "title": "عدم صلاحية القيادي", "sim": "القيادي اللي يتقدم عنه تقريران ورا بعض أقل من فوق المتوسط، خدمته بتنتهي لعدم الصلاحية للوظيفة، وبيحتفظ بحقه في المعاش.", "text": "تنتهي خدمة القيادي لعدم الصلاحية بتقريرين متتاليين أقل من فوق المتوسط، من اليوم التالي لآخر تقرير نهائي، مع حفظ حقه في المعاش.", "full": "تنتهي لعدم الصلاحية للوظيفة خدمة شاغلى الوظائف القيادية الذين يُقدم عنهم تقريران متتاليان بمرتبة أقل من فوق المتوسط من اليوم التالي لتاريخ صدور آخر تقرير نهائي مع حفظ حقهم في المعاش.", "reg": "لا توجد مادة مقابلة في اللائحة.", "ex": "مدير عام جاب متوسط مرتين ورا بعض، خدمته بتنتهي من تاني يوم لآخر تقرير نهائي وبيحتفظ بحقه في المعاش.", "test": {"q": "ما هي المرتبة التي إذا حصل عليها القيادي مرتين تنتهي خدمته بالوظيفة؟", "a": ["أقل من فوق المتوسط", "متوسط", "ضعيف"], "c": 0}}, {"id": "29", "title": "الترقية", "sim": "الترقية بتيجي من الوظيفة اللي بعدها مباشرة، وبتحتاج تقييم كفء أو ممتاز.", "text": "بقرار السلطة المختصة من الوظيفة التالية مباشرة.", "full": "مع مراعاة استيفاء الموظف لشروط شغل الوظيفة المرقى إليها، تكون الترقية بموجب قرار يصدر من السلطة المختصة من الوظيفة التي تسبقها مباشرة في المستوى والمجموعة الوظيفية التي تنتمي إليها. وتكون الترقية للوظائف التخصصية من المستوى الأول (ب) بالاختيار على أساس بيانات تقويم الأداء وما ورد في ملف الخدمة من عناصر الامتياز، وتكون الترقية للوظائف التخصصية الأخرى بالاختيار في حدود النسب الواردة في الجدول رقم (1) الملحق بهذا القانون. وتكون الترقية لباقى الوظائف بالأقدمية. ويُشترط للترقية أن يحصل الموظف على تقرير تقويم أداء بمرتبة كفء في السنتين السابقتين مباشرة على الترقية، أما الترقية بالاختيار في الوظائف التخصصية فيجب الحصول على تقرير تقويم أداء بمرتبة ممتاز. فإذا كان عدد من تتوافر فيهم شروط الترقية بالاختيار من الحاصلين على مرتبة ممتاز أقل من العدد المخصص للترقية بالاختيار تكون الترقية في الجزء الباقي من الحاصلين على مرتبة كفء على الأقل عن ذات المدة السابقة. فإذا كان عدد من تتوافر فيهم شروط الترقية بالاختيار أقل من العدد المخصص لها تؤجل الترقية وتحجز الوظائف في الجزء المتبقي إلى أول ترقية تالية. وباستثناء جزاءي الإنذار والخصم من الأجر مدة لا تزيد على عشرة أيام، لا تجوز ترقية الموظف قبل محو الجزاء الموقع عليه. وتحدد اللائحة التنفيذية ضوابط وإجراءات الترقية.", "reg": "لائحة (88): ترقية شاغلي الوظائف التخصصية بالاختيار في حدود النسب المبينة بالجدول (1) على أن يبدأ بالجزء المخصص للترقية بالاختيار، وتكون الترقية لباقي الوظائف بالأقدمية.\nلائحة (89): للترقية بالاختيار: ممتاز في السنتين السابقتين مباشرة، واجتياز التدريب الذي تتيحه الوحدة، ويُجبر الكسر لصالح الترقية بالاختيار. فإن قل عدد الحاصلين على ممتاز عن المخصص تكون الترقية في الباقي من الحاصلين على كفء، وإن قل عدد المستوفين عن المخصص تؤجل الترقية وتُحجز الوظائف لأول ترقية تالية.\nلائحة (90): للترقية بالأقدمية: كفء على الأقل في السنتين السابقتين مباشرة.\nلائحة (91): الشروط: وظيفة شاغرة وممولة تلي مباشرة وظيفته في ذات المستوى والمجموعة، واستيفاء شروط الوظيفة المرقى إليها، وقضاء المدد البينية بالجداول (1 و2 و3)، وصدور القرار من السلطة المختصة بناءً على اقتراح لجنة الموارد البشرية.\nلائحة (92): لا يجوز النظر في الترقية إذا كان معارًا إلا بعد عودته، أو في إجازة بدون أجر (عدا المرضية ورعاية الطفل) إلا بعد عودته، أو وُقع عليه خصم أجر لأكثر من 10 أيام أو جزاء أشد قبل محو الجزاء، أو محالًا للمحاكمة التأديبية أو الجنائية أو موقوفًا عن العمل (بحد أقصى سنتين تأخير).\nلائحة (93): يحتفظ المرقى بميعاد استحقاق العلاوة الدورية وبأرصدة إجازاته الاعتيادية.\nلائحة (94): تعد الموارد البشرية في نهاية كل سنة كشوفًا تتضمن: (1) إجمالي الوظائف الشاغرة الممولة التي يجوز الترقية إليها في كل مجموعة وظيفية والعدد المخصص للاختيار في كل وظيفة وفق الجدول (1)، (2) أسماء المرشحين لكل وظيفة بمن فيهم المحالون للمحاكمة التأديبية أو الجنائية والموقوفون والوظائف المحجوزة لهم (يُحدد تاريخ إحالة كل منهم وفق لائحة 167)، (3) تاريخ شغل المرشح لمستوى وظيفته الحالية ومجموعته من سجل الأقدمية، (4) تقارير أدائه عن السنوات الثلاث الأخيرة، (5) مدد الإعارة، (6) مدد الإجازات بدون أجر عدا المرضية ورعاية الطفل، (7) الجزاءات وتواريخها، (8) الدورات التدريبية ومدى اجتيازها، (9) الدرجات العلمية ومرتبة الحصول عليها، (10) أي بيانات لازمة.\nلائحة (95): تُعرض الكشوف على لجنة الموارد البشرية عند النظر في الترقية، وتُعرض توصياتها على السلطة المختصة لإصدار قرارات الترقية.", "ex": "لو عليك جزاء خصم أجر أكتر من 10 أيام، مينفعش تترقى إلا بعد ما الجزاء يتمحي (خصم 10 أيام أو أقل أو الإنذار ما بيمنعش الترقية).", "test": {"q": "ما هو التقييم المطلوب للترقية بالاختيار؟", "a": ["كفء", "ممتاز", "فوق المتوسط"], "c": 1}}, {"id": "30", "title": "الأفضلية بالاختيار", "sim": "لو الترقية بالاختيار، بيكسب اللي درجاته أعلى.", "text": "الأعلى في درجات آخر سنتين، ثم الأعلى علميًا، ثم الأقدم.", "full": "تُفضل عند الترقية بالاختيار ترقية الأعلى في مجموع درجات تقويم أداء السنتين السابقتين مباشرة على الترقية، وعند التساوى يفضل الأعلى في مجموع درجات تقويم أداء السنة السابقة عليهما، فالحاصل على درجة علمية أعلى متى كانت متصلة بطبيعة العمل طبقًا لما تقرره السلطة المختصة بناءً على اقتراح لجنة الموارد البشرية، وعند التساوى يفضل الأعلى في التقدير العام لهذه الدرجة، فالأقدم في المستوى الوظيفي المرقى منه.", "reg": "لائحة (96): عند الترقية بالاختيار يُفضَّل الأعلى في مجموع درجات تقويم أداء السنتين السابقتين مباشرة، وعند التساوي الأعلى في مجموع السنة السابقة عليهما، ثم الحاصل على درجة علمية أعلى متصلة بطبيعة العمل، ثم الأعلى في تقديرها العام، ثم الأقدم في المستوى المرقَّى منه.\nلائحة (89): يُجبر الكسر لصالح الوظائف المخصصة للترقية بالاختيار.", "ex": "صاحب الماجستير بيكسب لو تساوى مع دبلوم.", "test": {"q": "عند التساوي في درجات الترقية بالاختيار، من يُفضل؟", "a": ["الأقدم", "الأعلى علمياً", "الأصغر سناً"], "c": 1}}, {"id": "31", "title": "نفاذ الترقية", "sim": "الترقية بتتنفذ من تاريخ القرار، وبتاخد راتب الوظيفة الجديدة أو القديم + 5%.", "text": "من تاريخ القرار. يستحق الأجر المقرر للوظيفة الجديدة أو أجره السابق + علاوة 5%.", "full": "يصدر قرار الترقية من السلطة المختصة، وتعتبر الترقية نافذة من تاريخ صدور القرار بها. ويستحق الموظف اعتباراً من هذا التاريخ الأجر الوظيفى المقرر للوظيفة المرقى إليها أو أجره السابق مضافًا إليه علاوة ترقية بنسبة (5٪) من هذا الأجر الوظيفى أيهما أكبر.", "reg": "لائحة (93): يحتفظ الموظف المرقى بميعاد استحقاق العلاوة الدورية وبأرصدة إجازاته الاعتيادية.", "ex": "رقي في 1 يوليو، بياخد راتب الوظيفة الجديدة.", "test": {"q": "من أي تاريخ تعتبر الترقية نافذة؟", "a": ["من تاريخ القرار", "من أول الشهر التالي", "من تاريخ التوقيع"], "c": 0}}, {"id": "32", "title": "النقل", "sim": "النقل من مكان لمكان بشرط ميفوتش عليك الترقية.", "text": "بقرار السلطة المختصة بشرط ألا يفوت دوره في الترقية.", "full": "يجوز بقرار من السلطة المختصة نقل الموظف من وحدة إلى أخرى وذلك إذا كان النقل لا يفوت عليه دوره في الترقية أو كان بناءً على طلبه. ويكون نقل شاغلى الوظائف القيادية إلى خارج الوحدة بقرار من رئيس مجلس الوزراء. ولا يجوز نقل الموظف من وظيفة إلى أخرى تقل في مستواها عن مستوى وظيفته الأصلية. وتحدد اللائحة التنفيذية القواعد الخاصة بالنقل.", "reg": "لائحة (98-99): النقل بقرار السلطة المختصة داخل الوحدة أو خارجها، ونقل القياديين من وحدة لأخرى بقرار رئيس الوزراء. ويشترط: وظيفة شاغرة وممولة بالوحدة المنقول إليها (أو النقل بالمستوى الوظيفي، أو على إحدى الوظائف التي يوفرها الجهاز بالتنسيق مع وزارة المالية)، واستيفاء شروط الوظيفة، وبناءً على طلب الموظف أو طلب إحدى الوحدتين لتحقيق المصلحة العامة، وأن تسمح حاجة العمل، وموافقة الوحدة المنقول إليها، وألا يفوت دوره في الترقية إلا بطلبه، وألا يقل مستوى الوظيفة عن مستوى وظيفته الأصلية.\nلائحة (100-101): نقل غير القياديين من وحدة لأخرى بعد العرض على لجنتي الموارد البشرية في الوحدتين، ويكون نافذًا من تاريخ صدور قرار النقل من الوحدة المنقول منها محددًا فيه الجهة والوظيفة المنقول إليها. وعند تقدم الموظف (من غير القياديين والإشرافيين) بطلب نقل تثبت الموارد البشرية تاريخ ورود الطلب وتعرضه على لجنة الموارد البشرية في أول اجتماع تالٍ مشفوعًا بمذكرة تفصيلية عن حالته من ملف خدمته توضح مدى توفر شروط النقل.\nلائحة (102-105): تُرسل الموارد البشرية بالوحدة المنقول منها قرار النقل وملف الخدمة وما يفيد إخلاء الطرف للوحدة المنقول إليها خلال 30 يومًا من قرار النقل، ويُعتبر فوات المدة إقرارًا بخلو الطرف ما لم يرجع التأخير للموظف، ويستحق أجره من الجهة المنقول منها حتى إخلاء طرفه ومن الجديدة من تسلمه العمل، ويحتفظ بميعاد العلاوة الدورية وأرصدة إجازاته وتعتبر خدمته متصلة، ولا يجوز استخدام النقل كوسيلة لجزاء الموظف.\nلائحة (107): معادلة مستويات الموظفين الخاضعين لقوانين أو لوائح خاصة بمستويات الكادر العام بقرار من رئيس مجلس الوزراء.", "ex": "مينفعش تنقل من وظيفة أ لوظيفة ب الأقل.", "test": {"q": "هل يجوز نقل الموظف إلى وظيفة أقل في المستوى؟", "a": ["نعم", "لا", "نعم، إذا اقتضت مصلحة العمل"], "c": 1}}, {"id": "33", "title": "الندب", "sim": "الندب مؤقت (لحد 4 سنين)، بتروح تشتغل في مكان تاني وترجع.", "text": "مؤقت لوظيفة من ذات المستوى أو الأعلى مباشرة، بحد أقصى 4 سنوات، ولا يجوز خارج الوحدة إلا بطلب الموظف.", "full": "يجوز بقرار من السلطة المختصة ندب الموظف للقيام مؤقتًا بعمل وظيفة أخرى من ذات المستوى الوظيفي لوظيفته أو من المستوى الذي يعلوه مباشرةً في ذات الوحدة التي يعمل بها أو في وحدة أخرى، إذا كانت حاجة العمل في الوظيفة الأصلية تسمح بذلك. ولا يجوز ندب الموظف خارج الوحدة إلا بناءً على طلبه. وتُحدد اللائحة التنفيذية القواعد الخاصة بالندب، على ألا تزيد مدته على أربع سنوات. وللوحدة المنتدب إليها الموظف اتخاذ إجراءات نقله من الوحدة المنتدب منها، بعد هذه المدة، وفي حالة رغبة الموظف، ووفقًا لحاجة العمل. واستثناءً مما تقدم، يجوز بقرار من السلطة المختصة ندب الموظف بعد موافقته إلى الجمعيات والمؤسسات الأهلية ذات النفع العام، وتتحمل الوحدة بكامل الأجر أو بعضه، وذلك على النحو الذي تحدده اللائحة التنفيذية.", "reg": "لائحة (108): الندب الكلي بناءً على طلب الموظف لمدة لا تجاوز 4 سنوات في كل وحدة (ملاحظة: القانون يقول ألا تزيد مدة الندب على 4 سنوات دون عبارة «في كل وحدة»)، ويتقاضى كامل أجره من الجهة المنتدب إليها.\nلائحة (109-110): الندب الجزئي داخل أوقات العمل الرسمي بناءً على طلبه: أجره الوظيفي وجزء من المكمل من الجهة الأصلية بنسبة الوقت، ومكافأة من الجهة المنتدب إليها. والندب خارج أوقات العمل الرسمي لوحدة أخرى بناءً على طلبه وعرض الموارد البشرية مقابل مكافأة ندب تحددها السلطة المختصة بالجهة المنتدب إليها.\nلائحة (111): الندب بقرار السلطة المختصة إلى الجمعيات والمؤسسات الأهلية ذات النفع العام بعد موافقته، وتتحمل الوحدة الأجر الوظيفي، ويجوز للوحدة بعد موافقة السلطة المختصة تحمل كامل الأجر إذا كانت طبيعة الأعمال تأبى أن يتقاضى أي مبالغ من الجمعية أو المؤسسة، أو كانت غير قادرة على تحمل الأجر المكمل.\nلائحة (112-115): قرار الندب بعد موافقة الجهتين وتحدد فيه الجهة والوظيفة والمدة والبداية، ويخضع المنتدب إداريًا للجهة المنتدب إليها في الإشراف والتأديب، وينتهي بانتهاء مدته (ولكل طرف إنهاؤه بإخطار قبله بشهر على الأقل)، والجهة المنتدب منها تلتزم بأداء اشتراكات التأمين الاجتماعي. ولا يجوز ندب الموظف لأكثر من وحدة طوال مدة الندب.", "ex": "انتدبت إدارة تانية سنة.", "test": {"q": "ما هي المدة القصوى للندب؟", "a": ["سنتين", "3 سنوات", "4 سنوات"], "c": 2}}, {"id": "34", "title": "الحلول", "sim": "لو القيادي غاب، اللي بعده في الأقدمية هو اللي بيقوم بالشغل.", "text": "عند غياب القيادي يحل محله من يليه مباشرة في الأقدمية.", "full": "عند غياب شاغل وظيفة من الوظائف القيادية والإدارة الإشرافية عن العمل، يحل محله في مباشرة واجبات ومسئوليات وظيفته من يليه مباشرة في ترتيب الأقدمية ما لم تُحدد السلطة المختصة من يحل محله، على أن يكون من ذات مستواه أو من المستوى الأدنى مباشرة.", "reg": "لا توجد مادة مقابلة في اللائحة.", "ex": "المدير في إجازة، النائب بيقوم بشغله.", "test": {"q": "من يحل محل القيادي عند غيابه؟", "a": ["الأقدم في الوظيفة", "من يليه مباشرة في الأقدمية", "أي موظف"], "c": 1}}, {"id": "35", "title": "الإعارة", "sim": "الإعارة شغل برة (داخل أو خارج مصر)، وراتبك بيتدفع من الجهة اللي انت رايحها.", "text": "للداخل أو الخارج بموافقة كتابية؛ أجر المعار على الجهة المستعيرة.", "full": "يجوز بقرار من السلطة المختصة إعارة الموظف للعمل بالداخل أو الخارج بعد موافقة كتابية منه، ويُحدد القرار الصادر بالإعارة مدتها. ويترتب على إعارة شاغل وظيفة من الوظائف القيادية أو الإدارة الإشرافية انتهاء مدة شغله لها. ويكون أجر الموظف المعار بكامله على الجهة المستعيرة، وتدخل مدة الإعارة ضمن مدة خدمته، ولا يجوز ترقية المعار إلا بعد عودته من الإعارة واستكمال المدة البينية اللازمة لشغل الوظيفة الأعلى مباشرةً. ولا تدخل مدة الإعارة ضمن المدة البينية اللازمة للترقية. وتدخل مدة الإعارة ضمن مدة اشتراك الموظف في نظام التأمين الاجتماعي واستحقاق العلاوة، وذلك مع مراعاة أحكام قانون التأمين الاجتماعي الصادر بالقانون رقم 79 لسنة 1975. وتحدد اللائحة التنفيذية القواعد الخاصة بالإعارة.", "reg": "لائحة (116-117): الإعارة بقرار السلطة المختصة بناءً على عرض الموارد البشرية وطلب الجهة المعار إليها وموافقة الموظف كتابةً، لمدة سنة قابلة للتجديد، ويحدد القرار الجهة والوظيفة والمدة وتاريخ البداية.\nلائحة (118-119): يخضع المعار إداريًا للجهة المعار إليها، وتتحمل الأجر المخصص للوظيفة وجميع مخصصاتها ومميزاتها.\nلائحة (120): تدخل مدة الإعارة ضمن مدة الاشتراك في التأمين الاجتماعي واستحقاق العلاوة (مع مراعاة قانون التأمين الاجتماعي)، ولا تدخل في المدة البينية للترقية.\nلائحة (121): تنتهي بانتهاء مدتها أو تجديدها، وللموظف إنهاؤها قبل ذلك وعليه العودة خلال 15 يومًا من انتهائها (الإعارة الداخلية) أو 3 أشهر (الخارجية) مع تحمله اشتراكه التأميني عن هذه المدة، ويُصرف له أجره من تاريخ تسلمه العمل.\nلائحة (122): تبقى وظيفته خالية ويجوز شغلها إذا كانت المدة سنة فأكثر، وعند عودته يشغل وظيفته الأصلية أو أي وظيفة خالية من مستواها أو يبقى فيها بصفة شخصية على أن تسوى حالته في أول وظيفة تخلو من نفس مستوى وظيفته، وتعود له مميزات وظيفته الأصلية من تاريخ عودته.", "ex": "اتعارت للسعودية، راتبك بيتدفع بالكامل من الجهة اللي استعارتك، والمدة بتتحسب في خدمتك وتأمينك بس مش في المدة البينية للترقية.", "test": {"q": "من الذي يتحمل أجر الموظف المُعار؟", "a": ["الجهة الأصلية", "الجهة المستعيرة", "الموظف نفسه"], "c": 1}}, {"id": "36", "title": "الأجر الوظيفي", "sim": "الراتب الأساسي اللي في الجداول.", "text": "وفق الجداول 1 و2 و3. يستحقه من تاريخ تسلم العمل.", "full": "يُحدد الأجر الوظيفى للوظائف وفقًا للجداول أرقام (1، 2، 3) الملحقة بهذا القانون. ويستحق الموظف أجره من تاريخ تسلمه العمل، ما لم يكن مُستبقى بالقوات المسلحة فيستحق أجره من تاريخ التعيين.", "reg": "لائحة (2): الأجر الوظيفي: الأجر المنصوص عليه في الجداول الملحقة بالقانون مضمومًا إليه جميع العلاوات المقررة. الأجر المكمل: كل ما يحصل عليه الموظف نظير عمله بخلاف الأجر الوظيفي. كامل الأجر: الأجر الوظيفي + الأجر المكمل.", "ex": "بتستلم من أول يوم مباشرة عمل.", "test": {"q": "من أي تاريخ يستحق الموظف الأجر الوظيفي؟", "a": ["من تاريخ التوقيع", "من تاريخ تسلم العمل", "من أول الشهر"], "c": 1}}, {"id": "37", "title": "العلاوة الدورية", "sim": "كل سنة في 1 يوليو بتاخد علاوة 7% من راتبك.", "text": "أول يوليو بعد انقضاء سنة، بنسبة 7%.", "full": "يستحق الموظف علاوة دورية سنوية في الأول من ي
