وليو التالي لانقضاء سنة من تاريخ شغل الوظيفة أو من تاريخ استحقاق العلاوة الدورية السابقة بنسبة (7٪) من الأجر الوظيفى، على أن يعاد النظر في هذه النسبة بصفة دورية منتظمة.", "reg": "لا توجد مادة مقابلة مباشرة. (لائحة 93 و104: المرقى والمنقول يحتفظان بميعاد استحقاق العلاوة الدورية، ولائحة 120: مدة الإعارة تدخل في استحقاق العلاوة.)", "ex": "شغال سنة، في يوليو بتاخد 7%.", "test": {"q": "ما هي نسبة العلاوة الدورية السنوية؟", "a": ["5%", "7%", "10%"], "c": 1}}, {"id": "38", "title": "العلاوة التشجيعية", "sim": "علاوة 5% لو شغلك كفء لمدة سنتين.", "text": "5% من الأجر الوظيفي بشروط: كفء آخر عامين، لا تُمنح أكثر من مرة كل 3 أعوام، وبحد أقصى 10% من عدد الموظفين في كل مستوى (وواحد منهم لو العدد أقل من 10).", "full": "يجوز للسلطة المختصة منح الموظف علاوة تشجيعية بنسبة (5٪) من أجره الوظيفى، وذلك طبقاً للشروط الآتية: 1 - أن تكون كفاية الموظف قد حُددت برتبة كفء على الأقل عن العامين الأخيرين. 2 - ألا يمنح الموظف هذه العلاوة أكثر من مرة كل ثلاثة أعوام. 3 - ألا يزيد عدد الموظفين الذين يُمنحون هذه العلاوة في سنة واحدة على (10٪) من عدد الموظفين في وظائف كل مستوى من كل مجموعة نوعية على حدة، فإذا كان عدد الموظفين في تلك الوظائف أقل من عشرة، تُمنح العلاوة لواحد منهم.", "reg": "لائحة (123): تعرض إدارة الموارد البشرية على لجنة الموارد البشرية أو السلطة المختصة بيانًا بالموظفين المستوفين للشروط، وعند التزاحم يفضل الأعلى في مرتبة تقويم الأداء في السنتين الأخيرتين، فالأعلى في مجموع الدرجات، فالأقدم في ذات المستوى الوظيفي.", "ex": "متميز خد 5%، مش هياخدها تاني غير بعد 3 سنين.", "test": {"q": "كم مرة يجوز منح العلاوة التشجيعية للموظف؟", "a": ["كل سنة", "كل 3 أعوام", "كل 5 أعوام"], "c": 1}}, {"id": "39", "title": "حافز التميز العلمي", "sim": "لو جبت شهادة أعلى بتاخد مكافأة أو نسبة 7%.", "text": "7% من الأجر أو مبلغ ثابت أيهما أكبر.", "full": "يستحق الموظف الذي يحصل على مؤهل أعلى أثناء الخدمة حافز تميز علمى، ويُمنح الموظف هذا الحافز إذا حصل على دبلومة مدتها سنتان دراسيتان على الأقل أو على درجة الماجستير أو ما يعادلها أو دبلومتين من دبلومات الدراسات العليا مدة كل منهما سنة دراسية على الأقل، كما يُمنح الموظف حافز تميز آخر إذا حصل على درجة الدكتوراه أو ما يعادلها. ويكون حافز التميز العلمى المشار إليه بنسبة (7٪) من الأجر الوظيفى، أو الفئات المالية الآتية أيهما أكبر: 25 جنيهًا شهرياً لمن يحصل على مؤهل متوسط أو فوق المتوسط. 50 جنيهًا شهرياً لمن يحصل على مؤهل عال. 75 جنيهًا شهرياً لمن يحصل على دبلومة مدتها سنتان دراسيتان على الأقل. 100 جنيه شهرياً لمن يحصل على درجة الماجستير أو ما يعادلها، أو دبلومتين من دبلومات الدراسات العليا مدة كل منهما سنة دراسية على الأقل. 200 جنيه شهرياً لمن يحصل على درجة الدكتوراه أو ما يعادلها. وتحدد اللائحة التنفيذية شروط وضوابط منح حافز التميز، على ألا يجوز منح هذا الحافز أكثر من مرة عن ذات المستوى العلمي.", "reg": "لائحة (124): يُمنح الحافز بشروط: الحصول أثناء الخدمة على المؤهل الأعلى أو الدبلومات أو الدرجات العلمية المشار إليها في المادة (39) من القانون أو ما يعادلها، وأن يتصل ما يحصل عليه من دبلومات أو ماجستير أو دكتوراه بطبيعة الوظيفة التي يشغلها. ويُستحق من تاريخ اعتماد السلطة المختصة لشاغلي القيادية والإشرافية، ومن تاريخ اعتماد محضر لجنة الموارد البشرية لباقي الوظائف.\nلائحة (125): تعرض إدارة الموارد البشرية على السلطة المختصة خلال شهر (أو على لجنة الموارد البشرية في أول اجتماع تالٍ) بعد تقديم الطلب بيانًا بالموظفين المستوفين لشروط الحافز.", "ex": "جبت دكتوراه متصلة بشغلك، بتاخد 200 جنيه أو 7% من أجرك الوظيفي أيهما أكبر، ومش هتاخد حافز تاني عن نفس المستوى العلمي.", "test": {"q": "ما هي نسبة حافز التميز العلمي من الأجر؟", "a": ["5%", "7%", "10%"], "c": 1}}, {"id": "40", "title": "ضم العلاوات", "sim": "العلاوات بتتضاف للراتب الأساسي.", "text": "تُضم العلاوات المقررة إلى الأجر الوظيفي.", "full": "تُضم العلاوات المقررة بمقتضى هذا القانون إلى الأجر الوظيفى للموظف.", "reg": "لائحة (2): الأجر الوظيفي هو الأجر المنصوص عليه في الجداول الملحقة بالقانون مضمومًا إليه جميع العلاوات المقررة بمقتضى القانون.", "ex": "العلاوة الدورية بتزيد الراتب الأساسي.", "test": {"q": "هل تُضم العلاوات إلى الأجر الوظيفي؟", "a": ["نعم", "لا", "تُضم نصفها فقط"], "c": 0}}, {"id": "41", "title": "الأجر المكمل", "sim": "بدلات وحوافز بتتصرف بخلاف الراتب الأساسي.", "text": "بقرار رئيس الوزراء بعد موافقة وزير المالية.", "full": "يصدر بنظام الأجر المكمل قرار من رئيس مجلس الوزراء بمراعاة طبيعة عمل كل وحدة ونوعية الوظائف بها وطبيعة اختصاصاتها ومعدلات أداء موظفيها بحسب الأحوال بناءً على عرض الوزير المختص وبعد موافقة وزير المالية ودراسة الجهاز.", "reg": "لائحة (129): تدرج كل وحدة في مشروع موازنتها الاعتمادات اللازمة لمنح موظفيها الأجر الوظيفي والأجر المكمل طبقًا للقانون.\nلائحة (130): تلتزم إدارة الموارد البشرية بإخطار الوحدات الأخرى عند صرف أي مبالغ لأي من موظفيها، ويلتزم الموظف بإخطار جهة عمله الأصلية بأي مبالغ يتقاضاها من غير وحدته خلال 5 أيام عمل من تاريخ تقاضيها.", "ex": "بدل طبيعة عمل.", "test": {"q": "من يحدد نظام الأجر المكمل؟", "a": ["الوزير", "رئيس الوزراء", "رئيس الجهاز"], "c": 1}}, {"id": "42", "title": "المكافآت التشجيعية", "sim": "مكافآت لللي بيعمل حاجة مميزة.", "text": "للسلطة المختصة تقريرها لمن يقدم خدمات متميزة.", "full": "يجوز للسلطة المختصة تقرير مكافآت تشجيعية للموظف الذي يقدم خدمات ممتازة أو أعمالاً أو بحوثًا أو اقتراحات تساعد على تحسين طرق العمل، أو رفع كفاءة الأداء، أو توفير في النفقات، وذلك كله بشرط سماح البند المخصص لذلك في الموازنة العامة.", "reg": "لا توجد إضافة جوهرية.", "ex": "وفرت ملايين، الوزير بيديك مكافأة.", "test": {"q": "ما هو الشرط الأساسي لمنح المكافآت التشجيعية؟", "a": ["وجود بند في الموازنة", "موافقة النقابة", "موافقة الرئيس"], "c": 0}}, {"id": "43", "title": "الاحتفاظ بالأجر", "sim": "رئيس الجمهورية ممكن يخلي حد ياخد راتبه القديم.", "text": "لرئيس الجمهورية الاحتفاظ لمن يعين بوظيفة أخرى بأجره السابق.", "full": "يجوز لرئيس الجمهورية في الحالات التي يُقدرها الاحتفاظ لمن يُعيَّن بوظيفة أخرى بكامل أو بعض الأجر الذي كان يتقاضاه قبل التعيين بها.", "reg": "لا توجد إضافة جوهرية.", "ex": "وزير سابق عين في وظيفة أقل، بياخد راتبه القديم.", "test": {"q": "من يملك سلطة الاحتفاظ بالأجر السابق لمن يعين بوظيفة أخرى؟", "a": ["رئيس الوزراء", "رئيس الجمهورية", "وزير المالية"], "c": 1}}, {"id": "44", "title": "الابتكار", "sim": "أي اختراع بتعمله وانت موظف، ملك للدولة.", "text": "الاختراعات ملك للدولة ويكون للموظف تعويض عادل.", "full": "تشجع الدولة زيادة وعى الموظفين بالعلوم والتكنولوجيا، والعمل على نشر المعارف بينهم، وتطوير القدرات الابتكارية. وتكون الاختراعات والمصنفات التي يبتكرها الموظف أثناء تأدية وظيفته أو بسببها ملكاً للدولة إذا كان الاختراع نتيجة تجارب رسمية أو له صلة بالشئون العسكرية، أو إذا كان الاختراع أو المصنف يدخل في نطاق أعمال الوظيفة. وفى جميع الأحوال يكون للموظف الحق في تعويض عادل، يُراعَى عند تقديره تشجيع البحث والاختراع. ويجوز أن يُنشأ صندوق خاص في الوحدة، تتكون موارده من حصيلة استغلال حق هذه الاختراعات والمصنفات، ويكون الصرف من حصيلة هذا الصندوق طبقًا للائحة المالية التي تضعها السلطة المختصة.", "reg": "لائحة (126): يجب على الموظف إخطار الوحدة كتابة بأي اختراع أو مصنف يبتكره أثناء أو بسبب تأدية وظيفته إذا كان نتيجة تجارب أو بحوث رسمية أو له صلة بالشئون العسكرية أو يدخل في نطاق واجبات الوظيفة.\nلائحة (127): تشكل السلطة المختصة لجنة من ذوي الخبرة في مجال عمل الوحدة ومن ذوي التخصص في موضوع الاختراع أو الابتكار (من داخل الوحدة أو خارجها) لتقدير التعويض العادل للموظف (والاختراع المتصل بالشئون العسكرية يُحال للجهة المختصة)، وفي جميع الأحوال يكون الاختراع ملكًا للدولة.\nلائحة (128): تدرج موارد الصندوق الخاص بحصيلة استغلال الاختراعات ضمن الموازنة العامة للدولة، ويتم اعتماد اللائحة المالية للصندوق التي تضعها السلطة المختصة من وزارة المالية.", "ex": "اخترعت جهاز في الشغل، بيبقى للدولة.", "test": {"q": "لمن تعود ملكية الاختراعات التي يبتكرها الموظف أثناء تأدية وظيفته؟", "a": ["للموظف", "للدولة", "للجهة البحثية"], "c": 1}}, {"id": "45", "title": "الرعاية الاجتماعية", "sim": "النقابة والوزارة بيعملوا أنشطة ترفيهية.", "text": "السلطة والنقابة تضعان نظام رعاية اجتماعية وثقافية ورياضية.", "full": "تضع السلطة المختصة بالاشتراك مع اللجنة النقابية للوحدة نظامًا للرعاية الاجتماعية والثقافية والرياضية للموظفين بها، وذلك بمراعاة أحكام التشريعات ذات الصلة.", "reg": "لا توجد مادة مقابلة.", "ex": "نادي للموظفين.", "test": {"q": "من يضع نظام الرعاية الاجتماعية والثقافية للموظفين؟", "a": ["السلطة المختصة والنقابة", "الجهاز المركزي", "المحافظ"], "c": 0}}, {"id": "46", "title": "ساعات العمل", "sim": "الشغل من 35 لـ 42 ساعة في الأسبوع.", "text": "لا تقل عن 35 ولا تزيد عن 42 ساعة. تُخفض للمرضع وأصحاب الإعاقة.", "full": "تُحدد السلطة المختصة أيام العمل في الأسبوع ومواقيته وتوزيع ساعاته وفقًا لمقتضيات المصلحة العامة، على ألا يقل عدد ساعات العمل الأسبوعية عن خمس وثلاثين ساعة ولا يزيد على اثنتين وأربعين ساعة. وتُخفض عدد ساعات العمل اليومية بمقدار ساعة للموظف ذى الإعاقة، والموظفة التي ترضع طفلها وحتى بلوغه العامين، والحالات الأخرى التي تبينها اللائحة التنفيذية. ولا يجوز للموظف أن ينقطع عن عمله إلا لإجازة يُرخص له بها في حدود الإجازات المقررة في هذا القانون، ووفقًا للضوابط والإجراءات التي تحددها اللائحة التنفيذية، وإلا حُرم من أجره عن مدة الانقطاع دون الإخلال بمسئوليته التأديبية.", "reg": "لائحة (131): تُخفَّض ساعات العمل اليومية ساعة لكل من: ١) الموظف ذي الإعاقة. ٢) الموظف الذي لديه ولد من ذوي الإعاقة بقرار المجلس الطبي المختص. ٣) الموظفة التي ترضع طفلها حتى بلوغه العامين. ٤) الموظفة الحامل من الشهر السادس.\nلائحة (132): عند انقطاع الموظف يُخطر الرئيس المباشر إدارة الموارد البشرية يوم الانقطاع، وبعودته يُخطرها يوم العودة. ومن رُخص له بإجازة (عدا العارضة) يحرر إقرار قيام في آخر يوم عمل وإقرار عودة في أول يوم بعد عودته، ويقدمهما للرئيس المباشر للاعتماد ثم يُحالان لإدارة الموارد البشرية.\nلائحة (133): من يطلب مد إجازته يبلغ رئيسه بأي وسيلة يمكن إثباتها قبل انتهائها بوقت كاف؛ فإن لم يصله رد بالموافقة وجب عليه العودة للعمل (عدا الإجازات الوجوبية).", "ex": "دوام 40 ساعة، المرضع بتقلل ساعة.", "test": {"q": "ما هو الحد الأقصى لساعات العمل الأسبوعية؟", "a": ["40 ساعة", "42 ساعة", "48 ساعة"], "c": 1}}, {"id": "47", "title": "الأعياد والمناسبات", "sim": "الأعياد إجازة مدفوعة، ولو اشتغلت فيها بتاخد أجر مماثل زيادة على أجرك أو يوم إجازة بدلها.", "text": "إجازة بأجر كامل. ويجوز تشغيله فيها للضرورة مع أجر مماثل مضاف لأجره أو إجازة عوضًا عنها.", "full": "يستحق الموظف إجازة بأجر كامل عن أيام عطلات الأعياد والمناسبات الرسمية التي تُحدد بقرار من رئيس مجلس الوزراء، ويجوز تشغيل الموظف في هذه العطلات إذا اقتضت الضرورة ذلك، مع منحه أجرًا مماثلاً مضافًا إلى أجره المستحق أو إجازة عوضًا عنها. وتسرى بالنسبة للأعياد الدينية لغير المسلمين أحكام قرار رئيس مجلس الوزراء الصادر في هذا الشأن.", "reg": "لا توجد مادة مقابلة في اللائحة.", "ex": "اشتغلت يوم العيد، تاخد أجر يوم زيادة على راتبك أو يوم إجازة بدله.", "test": {"q": "إذا تم تشغيل الموظف في يوم عطلة رسمية، ماذا يستحق؟", "a": ["أجر مماثل أو إجازة بدلاً منها", "لا شيء", "نصف أجر"], "c": 0}}, {"id": "48", "title": "الإجازة العارضة", "sim": "7 أيام في السنة، بحد أقصى يومين كل مرة.", "text": "7 أيام في السنة بحد أقصى يومين في المرة.", "full": "للموظف أن ينقطع عن العمل لسبب عارض لمدة لا تتجاوز سبعة أيام خلال السنة وبحد أقصى يومان في المرة الواحدة.", "reg": "لائحة (132): الإجازة العارضة مستثناة من إقراري القيام والعودة.\nلائحة (148): المعيَّن لأول مرة لا يستحق في فترة الاختبار سوى العارضة والمرضية والوضع، وتُستنزل من فترة الاختبار.", "ex": "محتاج تمشي تقضي مصلحة، تاخد يومين.", "test": {"q": "كم عدد أيام الإجازة العارضة في السنة؟", "a": ["5 أيام", "7 أيام", "10 أيام"], "c": 1}}, {"id": "49", "title": "الإجازة الاعتيادية", "sim": "15 يوم أول سنة، 21 بعدها، 30 بعد 10 سنين، 45 بعد سن الخمسين.", "text": "15/21/30/45 يوم حسب المدة والسن (و45 يوم لذوي الإعاقة دون التقيد بسنوات الخدمة).", "full": "يستحق الموظف إجازة اعتيادية سنوية بأجر كامل، لا يدخل في حسابها أيام عطلات الأعياد والمناسبات الرسمية فيما عدا العطلات الأسبوعية، وذلك على الوجه الآتى: 1 - 15 يومًا في السنة الأولى، وذلك بعد مضى ستة أشهر من تاريخ استلام العمل. 2 - 21 يومًا لمن أمضى سنة كاملة في الخدمة. 3 - 30 يومًا لمن أمضى عشر سنوات في الخدمة. 4 - 45 يومًا لمن تجاوزت سنه الخمسين. ويستحق الموظف من ذوى الإعاقة إجازة اعتيادية سنوية مدتها خمسة وأربعون يومًا دون التقيد بعدد سنوات الخدمة. وللسلطة المختصة أن تقرر زيادة مدة الإجازة الاعتيادية بما لا يجاوز خمسة عشر يومًا لمن يعملون في المناطق النائية، أو إذا كان العمل في أحد فروع الوحدة خارج الجمهورية. ولا يجوز تقصير أو تأجيل الإجازة الاعتيادية أو إنهاؤها إلا لأسباب قومية تقتضيها مصلحة العمل.", "reg": "لائحة (134): تنشئ إدارة الموارد البشرية سجلًا لكل موظف فيه: رصيد ما قبل القانون، والمرحَّل من كل سنة من الثلاث السابقة، والمستحق عن السنة الحالية. تُستنزل الإجازات المأخوذة بالترتيب: المستحقة عن السنة الحالية أولًا، ثم المرحَّلة من الأقدم للأحدث، ثم المستحقة قبل القانون. ويُحدَّث السجل آخر كل سنة.\nلائحة (135): في نهاية كل سنة يُعد بيان بما تبقى من الرصيد (في ظل القانون والمرحَّل للسنة الثالثة) مع المقابل النقدي على أساس الأجر الوظيفي، يُعتمد من السلطة المختصة أو من تفوضه خلال 15 يومًا من إعداده ويُرسل للإدارات المعنية للتنفيذ، وتُسلَّم صورة منه للموظف خلال 15 يومًا أخرى.\nلائحة (136): تُخطر الإدارة كل موظف برصيده خلال 30 يومًا من بداية السنة. ويجوز له أخذ إجازة السنة مضافًا إليها 60 يومًا من الرصيد السابق، مرة واحدة أو على فترات، دون المساس بكامل أجره.\nلائحة (137): تُثبَّت على الطلب تاريخ وروده وتُسلَّم للموظف صورة معتمدة. يُعرض في اليوم التالي على الرئيس المرخِّص ليقرر خلال يومي عمل، وعند الرفض يُعرض في اليوم التالي على السلطة المختصة أو من تفوضه لتقرر منح الإجازة أو رفضها بقرار مسبب خلال يومي عمل من تاريخ العرض عليها. فوات المواعيد دون بتّ = رفض. ولا يجوز الرفض إلا في حدود ثلث إجازات السنة. ويُودع بملف الخدمة طلب الإجازة وقرار الرئيس المرخِّص أو قرار السلطة المختصة، وتُسلَّم صورة منه للموظف.", "ex": "عدّيت الخمسين (51 سنة)، إجازتك 45 يوم. ولو عمرك 50 بالظبط لسه ما تجاوزتش الخمسين.", "test": {"q": "كم عدد أيام الإجازة الاعتيادية لمن أمضى 10 سنوات في الخدمة؟", "a": ["21 يوم", "30 يوم", "45 يوم"], "c": 1}}, {"id": "50", "title": "ترحيل الاعتيادية", "sim": "لازم تقدم طلب بإجازتك، ولو ماطلبتش بتضيع. والترحيل مش بيتم غير لمصلحة العمل.", "text": "يجب طلب الإجازة وإلا سقط حقه فيها وفي مقابلها. ترحيلها لمصلحة العمل فقط، حتى الثلث ولمدة 3 سنوات. لو طلبها ورفضت: مقابل نقدي بعد 3 سنوات.", "full": "يجب على الموظف أن يتقدم بطلب للحصول على كامل إجازاته الاعتيادية السنوية. ولا يجوز للوحدة ترحيلها إلا لأسباب تتعلق بمصلحة العمل وفى حدود الثلث على الأكثر ولمدة لا تزيد على ثلاث سنوات. وإذا لم يتقدم الموظف بطلب للحصول على إجازته على النحو المشار إليه، سقط حقه فيها وفي اقتضاء مقابل عنها، أما إذا تقدم بطلب للحصول عليها ورفضته السلطة المختصة استحق مقابلًا نقديًا عنها يُصرف بعد مرور ثلاث سنوات على انتهاء العام المستحق عنه الإجازة على أساس أجره الوظيفى في هذا العام. وتبين اللائحة التنفيذية إجراءات الحصول على الإجازة، وكيفية ترحيلها.", "reg": "لائحة (138): لا يجوز ترحيل الاعتيادية المستحقة بعد العمل بالقانون من سنة للتالية إلا بتوافر:\n١) طلب من الموظف.\n٢) قرار السلطة برفض الطلب لأسباب تتعلق بمصلحة العمل.\n٣) أن يكون الترحيل في حدود ثلث إجازات السنة ولمدة لا تزيد على ثلاث سنوات.\nلائحة (139): مخالفة المواد 134 إلى 138 إخلال بواجبات الوظيفة يوجب المساءلة التأديبية.", "ex": "ماقدمتش طلب إجازة السنة دي خالص، حقك فيها وفي فلوسها بيضيع.", "test": {"q": "هل يجوز ترحيل الإجازات الاعتيادية بدون طلب من الموظف؟", "a": ["نعم", "لا", "نعم، بقرار من الرئيس المباشر"], "c": 1}}, {"id": "51", "title": "الإجازة المرضية", "sim": "3 شهور بأجر كامل، 3 بـ75%، 6 بـ50%.", "text": "لكل 3 سنوات: 3 أشهر بأجر كامل، 3 أشهر بـ75%، 6 أشهر بـ50%.", "full": "يستحق الموظف إجازة مرضية عن كل ثلاث سنوات تقضى في الخدمة، وتُمنح بقرار من المجلس الطبي المختص في الحدود الآتية: 1 - الثلاثة أشهر الأولى بأجر كامل. 2 - الثلاثة أشهر التالية بأجر يعادل (75٪) من الأجر الوظيفى. 3 - الستة أشهر التالية بأجر يعادل (50٪) من أجره الوظيفى، (75٪) من الأجر الوظيفى لمن جاوز سن الخمسين. ويحق للموظف طلب مد الإجازة المرضية بدون أجر للمدة التي يحددها المجلس الطبي المختص إذا قرر احتمال شفائه. ويحق للموظف أن يطلب تحويل الإجازة المرضية إلى إجازة اعتيادية، إذا كان له رصيد منها، وعلى الموظف المريض أن يخطر جهة عمله عن مرضه خلال أربع وعشرين ساعة من انقطاعه عن العمل للمرض إلا إذا تعذر عليه ذلك لأسباب قهرية. وتضع السلطة المختصة الإجراءات المنظمة لحصول الموظف على الإجازة المرضية، ويعتبر التمارض إخلالاً بواجبات الوظيفة. ويمنح الموظف المريض بأحد الأمراض المزمنة التي يصدر بتحديدها قرار من وزير الصحة بناءً على موافقة المجلس الطبي المختص إجازة استثنائية بأجر كامل إلى أن يشفي، أو تستقر حالته استقراراً يمكنه من العودة إلى العمل أو يتبين عجزه عجزاً كاملاً، وفي هذه الحالة الأخيرة يظل الموظف في إجازة مرضية بذات الأجر حتى بلوغه سن الإحالة للمعاش. وإذا رغب الموظف المريض في إنهاء إجازته والعودة إلى عمله، وجب عليه أن يقدم طلبًا كتابيًا بذلك، وأن يوافق المجلس الطبي المختص على عودته.", "reg": "لائحة (140): إذا انقطع الموظف بسبب المرض داخل الجمهورية يبلغ رئيسه المباشر خلال 24 ساعة مع بيان محل إقامته، فيحيله في اليوم ذاته عن طريق الموارد البشرية للمجلس الطبي المختص. وإذا انتهت الإجازة دون شفاء يعيد الإبلاغ في اليوم التالي على الأكثر لإعادة الكشف، ويتكرر ذلك حتى عودته.\nلائحة (141): إذا كان خارج الجمهورية يبلغ وحدته خلال 24 ساعة عن طريق البعثة الدبلوماسية إن وجدت، ويحصل على تقرير طبي مصدق منها، ويقدمه لجهة عمله بعد عودته لإحالته للمجلس الطبي.\nلائحة (142): إذا لم يقرر المجلس الطبي مرض الموظف تحيله الوحدة للتحقيق؛ فإن ثبت تمارضه جوزي تأديبيًا.", "ex": "مرضت، بتخطر في أول يوم.", "test": {"q": "ما هي المدة التي يحصل فيها الموظف على إجازة مرضية بأجر كامل؟", "a": ["شهر", "3 أشهر", "6 أشهر"], "c": 1}}, {"id": "52", "title": "إجازات بأجر كامل", "sim": "الحج 30 يوم، الوضع 4 شهور.", "text": "الحج 30 يومًا مرة واحدة • الوضع 4 أشهر حتى 3 مرات.", "full": "تكون حالات الترخيص بإجازة خاصة بأجر كامل على الوجه الآتى: 1 - يستحق الموظف إجازة لمدة ثلاثين يومًا، ولمرة واحدة طوال مدة عمله بالخدمة المدنية لأداء فريضة الحج. 2 - تستحق الموظفة إجازة وضع لمدة أربعة أشهر، بحد أقصى ثلاث مرات طوال مدة عملها بالخدمة المدنية، على أن تبدأ هذه الإجازة من اليوم التالى للوضع، ويجوز أن تبدأ هذه الإجازة قبل شهر من التاريخ المتوقع للوضع بناءً على طلب مقدم من الموظفة وتقرير من المجلس الطبي المختص. 3 - يستحق الموظف المخالط لمريض بمرض مُعد إجازة للمدة التي يحددها المجلس الطبي المختص. 4 - يستحق الموظف الذى يصاب إصابة عمل إجازة للمدة التي يحددها المجلس الطبي المختص، وذلك مع مراعاة أحكام قانون التأمين الاجتماعى المشار إليه. 5 - يستحق الموظف المقيد بإحدى الكليات أو المعاهد أو المدارس إجازة عن أيام الامتحان الفعلية.", "reg": "لائحة (143): يُقصد بالحج زيارة الأراضي المقدسة أو بيت المقدس.\nلائحة (144): تستحق الموظفة إجازة الوضع حتى لو توفي مولودها.\nلائحة (145): الموظف الذي يحصل على إجازة لأداء الامتحان يقدم ما يفيد دخوله الامتحان وإلا يُساءل تأديبيًا.", "ex": "الموظفة بتاخد 4 شهور وضع.", "test": {"q": "كم مدة إجازة الوضع للموظفة؟", "a": ["3 أشهر", "4 أشهر", "6 أشهر"], "c": 1}}, {"id": "53", "title": "إجازات بدون أجر", "sim": "إجازة من غير راتب طول مدة سفر زوجك/زوجتك (لو السفر 6 شهور أو أكتر)، أو لرعاية الطفل.", "text": "بدون أجر: مدة سفر الزوج/الزوجة (بشرط سفر 6 أشهر على الأقل) • رعاية الطفل عامين في المرة وبحد أقصى 6 أعوام.", "full": "تكون حالات الترخيص بالإجازة بدون أجر على الوجه الآتى: 1 - يُمنح الزوج أو الزوجة إذا سافر أحدهما إلى الخارج للعمل أو للدراسة لمدة ستة أشهر على الأقل إجازة بدون أجر مدة بقاء الزوج أو الزوجة في الخارج، وفى جميع الأحوال يتعين على الوحدة أن تستجيب لطلب الزوج أو الزوجة. 2 - يجوز للسلطة المختصة منح الموظف إجازة بدون أجر للأسباب التي يبديها وتقدرها السلطة المختصة ووفقًا لحاجة العمل. ولا يجوز في البندين السابقين ترقية الموظف إلا بعد عودته من الإجازة واستكمال المدة البينية اللازمة لشغل الوظيفة الأعلى مباشرة، ولا تدخل مدد الإجازات المنصوص عليها في هذين البندين ضمن المدد البينية اللازمة للترقية. 3 - مع مراعاة أحكام قانون الطفل الصادر بالقانون رقم (12) لسنة 1996، تستحق الموظفة إجازة بدون أجر لرعاية طفلها لمدة عامين على الأكثر في المرة الواحدة وبحد أقصى ستة أعوام طوال مدة عملها بالخدمة المدنية. واستثناءً من أحكام قانون التأمين الاجتماعي المشار إليه، تتحمل الوحدة اشتراكات التأمين المستحقة عليها وعلى الموظفة.", "reg": "لائحة (146): تستحق الموظفة إجازة بدون أجر لرعاية طفلها لمدة عامين على الأكثر في المرة الواحدة.\nلائحة (92): لا يجوز النظر في ترقية الموظف الحاصل على إجازة بدون أجر إلا بعد عودته، عدا الإجازة المرضية وإجازة رعاية الطفل.", "ex": "مسافرة مع زوجها برة، بتاخد إجازة بدون أجر.", "test": {"q": "كم مدة إجازة رعاية الطفل بدون أجر في المرة الواحدة؟", "a": ["سنة", "عامين", "3 أعوام"], "c": 1}}, {"id": "54", "title": "العمل بعض الوقت", "sim": "ممكن تاخد ترخيص تشتغل وقت أقل.", "text": "للسلطة الترخيص بذلك بطلبه مقابل نسبة من الأجر.", "full": "يجوز للسلطة المختصة، وفقًا للقواعد التي تضعها، الترخيص للموظف بأن يعمل بعض الوقت بناءً على طلبه وذلك مقابل نسبة من الأجر. ويستحق الموظف في هذه الحالة الإجازات الاعتيادية والعارضة والمرضية المقررة له بما يتفق مع الجزء من الوقت الذي خصصه لعمله. وتحدد اللائحة التنفيذية قواعد احتساب الأجر المشار إليه. واستثناءً من أحكام قانون التأمين الاجتماعي المشار إليه، تؤدى الاشتراكات المستحقة وفقًا لأحكام هذا القانون من الأجر المخفض على أساس الأجر الكامل، وتدخل المدة بالكامل ضمن مدة اشتراكه.", "reg": "لائحة (147): يجوز للسلطة المختصة الترخيص للموظف بالعمل ثلاثة أيام عمل أيًّا كان عدد أيام العمل بالوحدة، ويحصل على 65% من أجره الوظيفي والمكمل والإجازات الاعتيادية والمرضية والعارضة المقررة.", "ex": "ظروفك صعبة، تشتغل 3 أيام وتاخد 65%.", "test": {"q": "من الذي يملك سلطة الترخيص بالعمل بعض الوقت؟", "a": ["السلطة المختصة", "الرئيس المباشر", "النقابة"], "c": 0}}, {"id": "55", "title": "المجند والمستبقى", "sim": "اللي في الجيش مش بياخد الإجازات دي.", "text": "لا يستحقون الإجازات المنصوص عليها طوال وجودهم بالقوات المسلحة.", "full": "لا يستحق المجند والمستبقى للاحتياط والمستدعى لأية إجازة تم النص عليها في هذا القانون طوال مدة وجوده بالقوات المسلحة.", "reg": "لا توجد مادة مقابلة في اللائحة. (لائحة 148 تخص إجازات المعيَّن لأول مرة في فترة الاختبار، وهي مذكورة في مادة 48.)", "ex": "مجند، مش بياخد إجازة سنوية.", "test": {"q": "هل يستحق المجند الإجازات الاعتيادية أثناء وجوده بالقوات المسلحة؟", "a": ["نعم", "لا", "نعم، نصف الإجازات فقط"], "c": 1}}, {"id": "56", "title": "العمل للغير في الإجازة", "sim": "ممنوع تشتغل في مكان تاني وانت في إجازة.", "text": "محظور بغير ترخيص، وإلا حُرم من أجر الإجازة.", "full": "يُحظر على الموظف أن يؤدى عملاً للغير بأجر أو بدون أجر خلال مدة الإجازة بغير ترخيص من السلطة المختصة، وإلا حُرم من أجره عن مدة الإجازة، وللوحدة أن تسترد ما أدته إليه من أجر عن هذه المدة، وذلك دون الإخلال بالمسئولية التأديبية.", "reg": "لائحة (150): يُحظر على الموظف الجمع بين وظيفته وأي عمل آخر يؤديه بنفسه أو بالواسطة إذا كان يضر بأداء واجبات الوظيفة (بند 9)، وأداء أعمال للغير بأجر أو بمكافأة ولو في غير أوقات العمل الرسمية إلا بإذن السلطة المختصة (بند 10). ويجوز له تولي أعمال القوامة أو الوصاية أو الوكالة عن الغائبين أو المساعدة القضائية إذا كان المشمول بها ممن تربطهم به صلة قربى أو نسب حتى الدرجة الرابعة.", "ex": "اشتغلت في شركة وانت في إجازة، بتتحرم من أجرها.", "test": {"q": "ما هي عقوبة الموظف الذي يعمل للغير أثناء إجازته بدون ترخيص؟", "a": ["إنذار", "الحرمان من أجر الإجازة", "خصم 3 أيام"], "c": 1}}, {"id": "57", "title": "الواجبات والمحظورات", "sim": "لازم تحترم القانون، وممنوع تشتغل حزبي في الشغل.", "text": "يُحظر العمل الحزبي داخل العمل، وجمع التبرعات.", "full": "يتعين على الموظف الالتزام بأحكام هذا القانون ولائحته التنفيذية وغيرها من القوانين واللوائح والقرارات والتعليمات المنفذة لها، وما يصدر عن الجهاز من قرارات تنظيمية أو تعليمات أو نشرات أو كتب دورية في هذا الشأن، ومدونات السلوك وأخلاقيات الخدمة المدنية الصادرة من الوزير المختص. ويحظر على الموظف بصفة خاصة مباشرة الأعمال التي تتنافى مع الحياد والتجرد، والالتزام الوظيفي أثناء ساعات العمل الرسمية، أو ممارسة أي عمل حزبي، أو سياسي داخل مكان عمله، أو بمناسبة تأديته لهذا العمل، أو القيام بجمع تبرعات، أو مساهمات لصالح أحزاب سياسية، أو نشر الدعاية أو الترويج لها.", "reg": "لائحة (149): يجب على الموظف الالتزام بالقوانين واللوائح والقرارات والنظم المعمول بها والعمل على تطبيقها، و9 واجبات: (1) القيام بالعمل المنوط به بنفسه بدقة وأمانة وإنجازه في المواعيد المناسبة طبقًا لمعدلات الأداء، (2) الالتزام بمواعيد العمل الرسمية وتخصيص أوقاتها لأداء واجبات وظيفته، (3) المحافظة على كرامة الوظيفة وحسن سمعتها والمظهر اللائق ومراعاة آداب اللياقة مع الجمهور والرؤساء والزملاء والمرؤوسين، (4) التعاون مع رؤسائه وزملائه في العمل، (5) القيام بأي أعمال وظيفية يكلف بها ولو في غير مواعيد العمل الرسمية متى اقتضت مصلحة العمل، (6) المحافظة على ممتلكات وأموال الوحدة ومراعاة صيانتها، (7) إبلاغ الوحدة بمحل إقامته وحالته الاجتماعية وأي تغيير يطرأ عليهما خلال شهر على الأكثر، (8) تنفيذ ما يصدر إليه من أوامر بدقة وأمانة في حدود القوانين واللوائح، (9) الالتزام بمدونة السلوك وأخلاقيات الخدمة المدنية.\nلائحة (150): يُحظر على الموظف مخالفة القوانين واللوائح والقرارات والنظم المعمول بها، و17 محظورًا: (1) الأعمال التي تتنافى مع الحيدة والتجرد والالتزام الوظيفي أثناء ساعات العمل، (2) إفشاء المعلومات السرية التي يطلع عليها بحكم وظيفته إلا بإذن كتابي من الرئيس المختص (ويستمر الالتزام بعد ترك الخدمة)، (3) عدم الرد على مناقضات الجهاز المركزي للمحاسبات أو مكاتباته أو تأخير الرد، (4) عدم موافاة الجهاز المركزي للمحاسبات بالحسابات والمستندات المؤيدة لها في المواعيد أو بما يطلبه، (5) عدم موافاة الجهاز المركزي للتنظيم والإدارة بالبيانات والمستندات المطلوبة، (6) عدم الرد على مكاتبات الجهاز المركزي للتنظيم والإدارة أو تأخير الرد، (7) الاحتفاظ لنفسه بأصل أي ورقة رسمية أو نزعه من الملفات أو الاحتفاظ بصورة أي وثيقة رسمية أو سرية، (8) الإدلاء بأي تصريح أو بيان عن أعمال وظيفته عبر وسائل الإعلام والاتصال إلا بتصريح كتابي من الرئيس المختص، (9) الجمع بين وظيفته وأي عمل آخر يضر بأداء الواجبات أو لا يتفق مع مقتضياتها، (10) أداء أعمال للغير بأجر أو مكافأة ولو خارج أوقات العمل إلا بإذن السلطة المختصة (ويجوز القوامة والوصاية والوكالة عن الغائبين والمساعدة القضائية لمن تربطه به صلة قربى أو نسب حتى الدرجة الرابعة)، (11) العمل الحزبي أو السياسي أو جمع التبرعات أو الترويج لأحزاب أو جماعات داخل مكان العمل أو بمناسبته، (12) الاشتراك في تنظيم اجتماعات داخل مكان العمل دون إذن (مع عدم الإخلال بقوانين التنظيمات النقابية)، (13) استغلال نفوذه الوظيفي، (14) إساءة معاملة الجمهور أو التباطؤ المتعمد في الخدمة أو تأخيرها أو إساءة استعمال السلطة، (15) إساءة استخدام أدوات ومعدات العمل أو العبث بأصول الجهة أو التقصير الذي يضيع حقًا ماليًا للدولة أو العاملين أو المتعاملين، (16) قبول أي هدايا أو عمولة أو خدمة أو قرض بمناسبة واجبات وظيفته، (17) مباشرة نشاط أو سلوك يكدر الأمن العام أو يؤثر على السلام الاجتماعي أو يُفقده حسن السمعة وطيب السيرة اللازمين لشغل الوظائف العامة أو الاستمرار فيها.", "ex": "ممنوع تجمع تبرعات لحزب في مكتبك.", "test": {"q": "هل يجوز ممارسة العمل الحزبي داخل مكان العمل؟", "a": ["نعم", "لا", "نعم، بإذن السلطة المختصة"], "c": 1}}, {"id": "58", "title": "المسؤولية التأديبية", "sim": "اللي يغلط بيتحاسب. وحتى لو رئيسك أمرك، مش هتتبرأ إلا لو الأمر كان مكتوب وانت نبهته كتابة للمخالفة.", "text": "يُجازى من يخرج على واجبات وظيفته. لا يُعفى بأمر رئيسه إلا بأمر مكتوب.", "full": "كل موظف يخرج على مقتضى الواجب في أعمال وظيفته، أو يظهر منه ما من شأنه الإخلال بكرامة الوظيفة يجازى تأديبياً. ولا يعفى الموظف من الجزاء استنادًا إلى أمر صادر إليه من رئيسه إلا إذا ثبت أن ارتكاب المخالفة كان تنفيذًا لأمر مكتوب بذلك صادر إليه من هذا الرئيس، بالرغم من تنبيهه كتابة إلى المخالفة، وفى هذه الحالة تكون المسئولية على مُصدر الأمر وحده. ولا يسأل الموظف مدنيًا إلا عن خطئه الشخصي.", "reg": "لائحة (151): يُحال الموظف إلى التحقيق بموافقة أحد رؤسائه الإداريين بمستوى مدير عام على الأقل.", "ex": "رئيسك أمرك تغلط، لازم يكون مكتوب.", "test": {"q": "هل يُعفى الموظف من المسؤولية إذا ارتكب مخالفة بناءً على أمر رئيسه؟", "a": ["نعم دائماً", "لا، إلا إذا كان الأمر مكتوباً", "نعم إذا كان الرئيس قيادياً"], "c": 1}}, {"id": "59", "title": "ضمانات التأديب", "sim": "مفيش عقوبة غير بعد تحقيق وسماع كلامك.", "text": "لا جزاء إلا بعد تحقيق كتابي وسماع الأقوال وتحقيق الدفاع، ويصدر القرار مسببًا. والتحقيق ممكن يكون شفاهة في الإنذار والخصم لحد 3 أيام، ويُثبت مضمونه في قرار الجزاء.", "full": "لا يجوز توقيع أي جزاء على الموظف إلا بعد التحقيق معه كتابةً، وسماع أقواله وتحقيق دفاعه، ويكون القرار الصادر بتوقيع الجزاء مسبباً. ومع ذلك، يجوز بالنسبة لجزاء الإنذار والخصم من الأجر لمدة لا تجاوز ثلاثة أيام أن يكون التحقيق شفاهة، على أن يثبت مضمونه في القرار الصادر بتوقيع الجزاء.", "reg": "لائحة (152): يُعلن الموظف كتابة بقرار الإحالة بأمر استدعاء فيه: اسمه رباعيًا، رقمه القومي، وظيفته، موضوع المخالفة، السلطة التي قررت الإحالة وتاريخ القرار، وموعد ومكان بدء التحقيق (في مدة لا تتجاوز 10 أيام من تسلمه قرار الإحالة).\nلائحة (153): إذا امتنع عن الحضور يُعاد إعلانه خلال 3 أيام عمل بموعد جديد، فإن تخلف سارت جهة التحقيق في الاستكمال، ونفس الحكم عند رفضه تسلم الاستدعاء (يُثبت ذلك ويُودع بأوراق التحقيق).\nلائحة (154): للمحقق الاطلاع على السجلات والأوراق وختمها، وطلب صور الأوراق، وطلب رأي أو شهادة أحد شاغلي القيادية كتابيًا.\nلائحة (155): التحقيق كتابة في محضر مرقم بأرقام مسلسلة، يُذكر فيه التاريخ والساعة ومقر فتح المحضر واسم المحقق وقرار الإحالة والسلطة التي أصدرته وبيانات المحال (سنه ومحل إقامته وإدارته ووظيفته ومستواها) وملخص الواقعة وأقوال شهود الإثبات والنفي وما تم الاطلاع عليه من مستندات وساعة وتاريخ غلق المحضر، وتُذيَّل كل صفحة بتوقيع المحقق ومن أدلى بأقواله.\nلائحة (156): للمحال الاطلاع على كافة أوراق التحقيق وتقديم مستندات دفاعه.\nلائحة (157): الموظف المستدعى للشهادة الذي يمتنع عن الحضور أو الإدلاء بما لديه دون عذر مقبول يُساءل تأديبيًا.", "ex": "اتهمت بغلط، لازم جلسة تحقيق تسمع فيها كلامك.", "test": {"q": "هل يجوز توقيع جزاء على الموظف دون إجراء تحقيق؟", "a": ["نعم", "لا", "نعم، إذا كان الجزاء إنذارًا فقط"], "c": 1}}, {"id": "60", "title": "النيابة الإدارية", "sim": "النيابة الإدارية هي اللي بتحقق مع القيادات.", "text": "تختص بالتحقيق مع القياديين وفي المخالفات المالية. وأي تحقيق للجهة الإدارية في واقعة بدأتها النيابة لازم يتوقف، وإلا بطل الإجراء.", "full": "تختص النيابة الإدارية دون غيرها بالتحقيق مع شاغلى الوظائف القيادية، وكذا تختص دون غيرها بالتحقيق في المخالفات المالية التي يترتب عليها ضياع حق من الحقوق المالية للدولة أو المساس بها. كما تتولى التحقيق في المخالفات الأخرى التي تحال إليها ويكون لها بالنسبة لهذه المخالفات السلطات المقررة للسلطة المختصة في توقيع الجزاءات أو الحفظ. وعلى الجهة الإدارية المختصة بالنسبة لسائر المخالفات أن توقف ما تجريه من تحقيق في واقعة ما أو وقائع وما يرتبط بها إذا كانت النيابة الإدارية قد بدأت التحقيق فيها، ويقع باطلاً كل إجراء أو تصرف يخالف ذلك.", "reg": "لائحة (158): إذا ظهرت أثناء التحقيق شبهة جريمة جنائية يُعرض الأمر على السلطة المختصة لإبلاغ النيابة العامة، ولا يمنع ذلك توقيع الجزاء التأديبي ما لم تتوقف المسؤولية التأديبية على الفصل في الدعوى الجنائية.\nلائحة (159): إذا تعدد المحالون للتحقيق وكان التحقيق مع أحدهم من اختصاص النيابة الإدارية، يُعرض الموضوع على السلطة المختصة لإحالته إليها.", "ex": "مدير عام اتهم بإهدار مال عام.", "test": {"q": "من الجهة المختصة بالتحقيق مع شاغلي الوظائف القيادية؟", "a": ["الشؤون القانونية", "النيابة الإدارية", "الجهاز المركزي للمحاسبات"], "c": 1}}, {"id": "61", "title": "الجزاءات", "sim": "فيه 8 عقوبات للموظف، و4 للقيادي.", "text": "للموظف 8 جزاءات، وللقيادي 4.", "full": "الجزاءات التي يجوز توقيعها على الموظف هي: 1 - الإنذار. 2 - الخصم من الأجر لمدة أو مدد لا تجاوز ستين يومًا في السنة. 3 - الوقف عن العمل لمدة لا تجاوز ستة أشهر مع صرف نصف الأجر الكامل. 4 - تأجيل الترقية عند استحقاقها لمدة لا تزيد على سنتين. 5 - الخفض إلى وظيفة في المستوى الأدنى مباشرة. 6 - الخفض إلى وظيفة في المستوى الأدنى مباشرة مع خفض الأجر إلى القدر الذي كان عليه قبل الترقية. 7 - الإحالة إلى المعاش. 8 - الفصل من الخدمة. أما الجزاءات التي يجوز توقيعها على شاغلى الوظائف القيادية هي: 1 - التنبيه. 2 - اللوم. 3 - الإحالة إلى المعاش. 4 - الفصل من الخدمة. وللسلطة المختصة بعد توقيع جزاء تأديبي على أحد شاغلي الوظائف القيادية والإدارة الإشرافية تقدير مدى استمراره في شغل تلك الوظيفة. وتحتفظ كل وحدة في حساب خاص بحصيلة جزاءات الخصم الموقعة على العاملين، ويكون الصرف من هذه الحصيلة في الأغراض الاجتماعية، أو الثقافية، أو الرياضية للعاملين طبقًا للشروط والأوضاع التي تحددها السلطة المختصة.", "reg": "لائحة (162): لا يجوز معاقبة الموظف تأديبيًا عن الفعل ذاته أكثر من مرة.\nلائحة (163): يُعلن الموظف كتابة بقرار الجزاء وأسبابه خلال 7 أيام عمل من تاريخ صدوره؛ فإن امتنع عن تسلم الإعلان أو التوقيع يُؤشَّر بذلك ويُكتفى بنشر القرار على لوحة الإعلانات. وينفذ جزاء الخصم من الأجر الوظيفي المستحق من أجر الشهر التالي لإعلانه أو نشره، في الحدود الجائزة قانونًا.\nلائحة (164): تُودع أوراق التحقيق والجزاء بملف فرعي يلحق بملف الخدمة، وتُعد صحيفة خاصة بالجزاءات تُسجل بها المخالفات والجزاءات وتواريخ وأرقام القرارات. وإذا أسفر التحقيق عن أكثر من مخالف يُكتفى بحفظ أوراق التحقيق بملف المخالف الأول وتُحفظ صورة طبق الأصل منها بملف الباقين.", "ex": "خصم، أو فصل، أو لوم للقيادي.", "test": {"q": "كم عدد الجزاءات التي يجوز توقيعها على الموظف؟", "a": ["5 جزاءات", "8 جزاءات", "10 جزاءات"], "c": 1}}, {"id": "62", "title": "سلطة التحقيق والجزاء", "sim": "الرئيس المباشر ليه صلاحية الخصم لغاية 3 أيام.", "text": "الرئيس المباشر: خصم حتى 3 أيام/المرة و20/السنة. وجهة الندب أو الإعارة هي المختصة بالتحقيق والتأديب عن المخالفات أثناء الندب أو الإعارة.", "full": "يكون الاختصاص بالتصرف في التحقيق على النحو الآتى: 1 - للرؤساء المباشرين الذين تُحددهم السلطة المختصة كل في حدود اختصاصه، حفظ التحقيق أو توقيع جزاء الإنذار أو الخصم من الأجر، بما لا يجاوز عشرين يومًا في السنة ولا يزيد على ثلاثة أيام في المرة الواحدة. 2 - لشاغلى الوظائف القيادية والإدارة الإشرافية كل في حدود اختصاصه، حفظ التحقيق أو توقيع جزاء الإنذار أو الخصم من الأجر، بما لا يجاوز أربعين يومًا في السنة ولا يزيد على خمسة عشر يومًا في المرة الواحدة. 3 - للسلطة المختصة حفظ التحقيق أو توقيع أي من الجزاءات المنصوص عليها في البنود من (1) إلى (5) من الفقرة الأولى من المادة (61) من هذا القانون والبنود (1، 2) من الفقرة الثانية من ذات المادة. 4 - للمحكمة التأديبية المختصة توقيع أي من الجزاءات المنصوص عليها في هذا القانون. وتكون الجهة المنتدب أو المعار إليها الموظف هي المختصة بالتحقيق معه وتأديبه طبقًا لأحكام هذا القانون عن المخالفات التي يرتكبها خلال فترة الندب أو الإعارة.", "reg": "لائحة (151): يُحال الموظف للتحقيق بموافقة أحد رؤسائه الإداريين بمستوى مدير عام على الأقل.\nلائحة (162): لا يجوز معاقبة الموظف تأديبيًا عن الفعل ذاته أكثر من مرة.\nلائحة (160): فترة التحقيق تبدأ من تاريخ إحالة الموظف وتنتهي بإعداد التقرير النهائي، ولا تتجاوز 3 أشهر ويجوز مدها لفترة أخرى بموافقة السلطة المختصة.\nلائحة (161): بعد انتهاء التحقيق تُعد جهة التحقيق مذكرة بنتيجته وتُعرض على السلطة المختصة للتصرف فيه بالحفظ أو توقيع الجزاء المناسب.", "ex": "الرئيس المباشر مينفعش يخصم 10 أيام.", "test": {"q": "ما هو الحد الأقصى للخصم الذي يمكن للرئيس المباشر توقيعه في المرة الواحدة؟", "a": ["يوم واحد", "3 أيام", "5 أيام"], "c": 1}}, {"id": "63", "title": "الوقف الاحتياطي", "sim": "ممكن يتوقف عن الشغل 3 شهور وياخد نص راتبه.", "text": "للسلطة المختصة أو رئيس النيابة الإدارية إيقافه احتياطيًا لمصلحة التحقيق 3 أشهر بنصف الأجر، ولا تُمد المدة إلا بقرار المحكمة التأديبية. ويجب عرض أمر باقي الأجر على المحكمة خلال 10 أيام وإلا صُرف كاملًا. وعلى المحكمة الفصل خلال 20 يومًا. ولو برئ أو عوقب بإنذار/خصم حتى 5 أيام يُصرف له ما أوقف من أجره.", "full": "لكل من السلطة المختصة ورئيس هيئة النيابة الإدارية بحسب الأحوال أن يوقف الموظف عن عمله احتياطيًا إذا اقتضت مصلحة التحقيق معه ذلك لمدة لا تزيد على ثلاثة أشهر، ولا يجوز مد هذه المدة إلا بقرار من المحكمة التأديبية المختصة للمدة التي تحددها. ويترتب على وقف العامل عن عمله وقف صرف نصف أجره ابتداءً من تاريخ الوقف. ويجب عرض الأمر فوراً على المحكمة التأديبية المختصة لتقرير صرف أو عدم صرف المتبقى من أجره، فإذا لم يعرض الأمر عليها خلال عشرة أيام من تاريخ الوقف وجب صرف كامل أجره حتى تقرر المحكمة ما يُتبع في شأنه. وعلى المحكمة التأديبية أن تصدر قرارها خلال عشرين يومًا من تاريخ رفع الأمر إليها، فإذا لم تصدر قرارها في خلال هذه المدة يصرف الأجر كاملاً. فإذا برئ الموظف أو حفظ التحقيق معه أو جوزي بجزاء الإنذار أو الخصم من الأجر لمدة لا تجاوز خمسة أيام صرف إليه ما يكون قد أوقف صرفه من أجره، وإذا جوزي بجزاء أشد تقرر السلطة التي وقعت الجزاء ما يتبع في شأن الأجر الموقوف صرفه، فإن جوزي بجزاء الفصل انتهت خدمته من تاريخ وقفه ولا يجوز أن يسترد منه في هذه الحالة ما سبق أن صرف له من أجر.", "reg": "لائحة (165): يُعرض الأمر على السلطة المختصة بمذكرة فيها موضوع التحقيق ومبررات الوقف ومدته (بما لا يجاوز 3 أشهر)، فإذا قررت الوقف يُعلن الموظف بالقرار وتُرسل صورة منه إلى رئيسه المباشر وإدارة الموارد البشرية.", "ex": "قضية كبيرة، بيوقف 3 شهور بنص راتب.", "test": {"q": "كم مدة الوقف الاحتياطي عن العمل؟", "a": ["شهر", "3 أشهر", "6 أشهر"], "c": 1}}, {"id": "64", "title": "الحبس", "sim": "لو اتحبس، بياخد نص راتبه أو مفيش.", "text": "حبس احتياطي أو تنفيذًا لحكم غير نهائي: يُحرم من نصف أجره. حكم نهائي: يُحرم من كامل الأجر.", "full": "كل موظف يُحبس احتياطيًّا أو تنفيذًا لحكم جنائي يُوقّف عن عمله، بقوة القانون مدة حبسه، ويحرم من نصف أجره إذا كان الحبس احتياطيًّا أو تنفيذًا لحكم جنائي غير نهائي، ويُحرم من كامل أجره إذا كان الحبس تنفيذًا لحكم جنائي نهائي. وإذا لم يكن من شأن الحكم الجنائي إنهاء خدمة الموظف يُعرض أمره عند عودته إلى عمله على السلطة المختصة لتقرير ما يُتبع في شأن مسئوليته التأديبية.", "reg": "لا توجد إضافة جوهرية.", "ex": "محبوس احتياطي، بياخد نص راتب.", "test": {"q": "ماذا يستحق الموظف المحبوس احتياطياً من أجره؟", "a": ["كامل الأجر", "نصف الأجر", "لا شيء"], "c": 1}}, {"id": "65", "title": "المحال للمحاكمة", "sim": "اللي محال للمحاكمة مبيترقاش.", "text": "لا ترقية للمحال أو الموقوف، وتُحجز له وظيفة. ولو برئ أو عوقب بإنذار/خصم حتى 10 أيام يُرقى بأثر رجعي، ولا يتأخر أكثر من سنتين.", "full": "لا تجوز ترقية الموظف المحُال إلى المحاكمة التأديبية أو الجنائية أو الموقوف عن العمل مدة الإحالة أو الوقف، وفى هذه الحالة تحجز وظيفة للموظف. وإذا بُرِّئ الموظف المحال أو قضى بحكم نهائى بمعاقبته بالإنذار أو الخصم من الأجر لمدة لا تزيد على عشرة أيام وجب ترقيته اعتباراً من التاريخ الذى كانت ستتم فيه الترقية لو لم يُحل إلى المحاكمة، ويُمنح أجر الوظيفة المرقى إليها من هذا التاريخ. وفى جميع الأحوال، لا يجوز تأخير ترقية الموظف لمدة تزيد على سنتين.", "reg": "لائحة (166): يُعتبر الموظف محالًا للمحاكمة التأديبية من تاريخ إيداع قرار الإحالة قلم كتاب المحكمة التأديبية، ومحالًا للمحاكمة الجنائية من تاريخ صدور أمر الإحالة من قاضي التحقيق أو تكليف المتهم بالحضور أمام المحكمة من النيابة العامة أو المدعي بالحق المدني.\nلائحة (92): لا يُنظر في ترقية المحال للمحاكمة أو الموقوف طوال مدة الإحالة أو الوقف، ولا يجوز تأخير ترقيته أكثر من سنتين.", "ex": "أتحال للمحاكمة، اتأجلت ترقيتي.", "test": {"q": "هل يجوز ترقية الموظف المحال إلى المحاكمة التأديبية؟", "a": ["نعم", "لا", "نعم، بموافقة النيابة الإدارية"], "c": 1}}, {"id": "66", "title": "ما بعد انتهاء الخدمة", "sim": "لو فيه تحقيق بدأ معاك، مينفعش تسيب الشغل وتخلص.", "text": "انتهاء الخدمة (عدا الوفاة) ما يمنعش المحاكمة التأديبية لو التحقيق بدأ قبله. وفي مخالفات ضياع حق الخزانة العامة تجوز الدعوى حتى 5 سنوات بعد الانتهاء، مع غرامة لا تتجاوز 10 أضعاف الأجر الوظيفي الشهري.", "full": "لا يمنع انتهاء خدمة الموظف لأى سبب من الأسباب عدا الوفاة من محاكمته تأديبيًّا إذا كان قد بدئ في التحقيق قبل انتهاء مدة خدمته. ويجوز في المخالفات التي يترتب عليها ضياع حق من حقوق الخزانة العامة للدولة إقامة الدعوى التأديبية ولو لم يكن قد بدئ في التحقيق قبل انتهاء الخدمة وذلك لمدة خمس سنوات من تاريخ انتهائها. ويجوز أن يوقع على من انتهت خدمته غرامة لا تجاوز عشرة أضعاف أجره الوظيفى الذي كان يتقاضاه في الشهر عند انتهاء الخدمة، وذلك مع عدم الإخلال بالعقوبات الجنائية، والتزامه برد قيمة الحق، واستثناءً من أحكام قانون التأمين الاجتماعى المشار إليه، تستوفى الغرامة المشار إليها بالفقرة السابقة من المعاش بما لا يجاوز ربعه أو بطريق الحجز الإداري.", "reg": "لا توجد مادة مقابلة مباشرة في اللائحة. (لائحة 164: تُودع أوراق التحقيق والجزاء بملف فرعي يلحق بملف خدمة الموظف.)", "ex": "استقلت وفيه تحقيق، ممكن تتحاسب.", "test": {"q": "هل ينتهي حق الجهة في المحاكمة التأديبية بانتهاء خدمة الموظف إذا بدأ التحقيق؟", "a": ["نعم", "لا", "ينتهي بعد ستة أشهر من انتهاء الخدمة"], "c": 1}}, {"id": "67", "title": "محو الجزاءات", "sim": "العقوبات بتتمحي من ملفك بعد فترة.", "text": "سنة (إنذار/تنبيه/خصم حتى 5 أيام) • سنتان (لوم/خصم من 5 لـ 15 يوم) • 3 سنوات (خصم من 15 لـ 30 يوم) • 4 سنوات (باقي الجزاءات عدا الفصل والإحالة للمعاش).", "full": "تمحى الجزاءات التأديبية التي توقع على الموظف بانقضاء الفترات الآتية: 1 - سنة في حالة الإنذار والتنبيه والخصم من الأجر مدة لا تزيد على خمسة أيام. 2 - سنتان في حالة اللوم والخصم من الأجر مدة تزيد على خمسة أيام وحتى خمسة عشر يومًا. 3 - ثلاث سنوات في حالة الخصم من الأجر مدة تزيد على خمسة عشر يومًا وحتى ثلاثين يومًا. 4 - أربع سنوات بالنسبة إلى الجزاءات الأخرى عدا جزاى الفصل والإحالة إلى المعاش. وتحسب فترات المحو اعتباراً من تاريخ توقيع الجزاء. ويترتب على محو الجزاء اعتباره كأن لم يكن بالنسبة للمستقبل ولا يؤثر على الحقوق والتعويضات التي ترتبت نتيجة له. وتحدد اللائحة التنفيذية إجراءات المحو.", "reg": "لائحة (167): تُمحى الجزاءات بانقضاء الفترات المنصوص عليها في مادة 67 بقرار من السلطة المختصة بناءً على عرض إدارة الموارد البشرية، دون حاجة إلى طلب من الموظف.\nلائحة (195): تسري على الجزاءات التأديبية التي وقعت على الموظف قبل العمل بالقانون القواعد المقررة بقانون العاملين المدنيين بالدولة رقم 47 لسنة 1978.", "ex": "إنذار في 2023، بيتمحي في 2024.", "test": {"q": "ما هي المدة اللازمة لمحو جزاء 'الإنذار' من ملف الموظف؟", "a": ["6 أشهر", "سنة", "سنتان"], "c": 1}}, {"id": "68", "title": "سقوط الدعوى", "sim": "لو عدت 3 سنين على المخالفة، الدعوى بتسقط.", "text": "بمضي 3 سنوات من ارتكاب المخالفة، وتنقطع المدة بأي إجراء.", "full": "تسقط الدعوى التأديبية بالنسبة للموظف الموجود بالخدمة بمضى ثلاث سنوات من تاريخ ارتكاب المخالفة. وتنقطع هذه المدة بأى إجراء من إجراءات التحقيق أو الاتهام أو المحاكمة وتسرى المدة من جديد ابتداءً من آخر إجراء. وإذا تعدد المتهمون فإن انقطاع المدة بالنسبة لأحدهم يترتب عليه انقطاعها بالنسبة للباقين ولو لم تكن قد اتخذت ضدهم إجراءات قاطعة للمدة. ومع ذلك إذا شكل الفعل جريمة جنائية، فلا تسقط الدعوى التأديبية إلا بسقوط الدعوى الجنائية.", "reg": "لا توجد مادة مقابلة في اللائحة. (مدة التحقيق 3 أشهر في لائحة 160 موضحة في مادة 62.)", "ex": "مخالفة قديمة من 4 سنين، سقطت.", "test": {"q": "بمضي كم سنة تسقط الدعوى التأديبية؟", "a": ["سنة", "سنتين", "3 سنوات"], "c": 2}}, {"id": "69", "title": "أسباب انتهاء الخدمة", "sim": "10 أسباب لخروجك من الشغل.", "text": "10 أسباب: بلوغ الستين • الاستقالة • المعاش • الغياب 15 يومًا • الوفاة.", "full": "تنتهي خدمة الموظف لأحد الأسباب الآتية: 1 - بلوغ سن الستين بمراعاة أحكام قانون التأمين الاجتماعى المشار إليه، ويجوز بقرار من رئيس الجمهورية لاعتبارات يقدرها مد الخدمة لشاغلى الوظائف القيادية لمدة لا تجاوز ثلاث سنوات. 2 - الاستقالة. 3 - الإحالة إلى المعاش أو الفصل من الخدمة. 4 - فقد الجنسية، أو انتفاء شرط المعاملة بالمثل بالنسبة لرعايا الدول الأخرى. 5 - الانقطاع عن العمل بدون إذن خمسة عشر يومًا مستمرة ما لم يقدم خلال الخمسة عشر يومًا التالية ما يثبت أن الانقطاع كان بعذر مقبول. 6 - الانقطاع عن العمل بدون إذن ثلاثين يومًا غير متصلة في السنة. 7 - عدم اللياقة للخدمة صحياً وذلك بقرار من المجلس الطبي المختص. 8 - الالتحاق بخدمة جهة أجنبية بغير ترخيص من حكومة جمهورية مصر العربية. 9 - الحكم عليه بعقوبة جناية أو بعقوبة مقيدة للحرية في جريمة مخلة بالشرف أو الأمانة أو تفقده الثقة والاعتبار. 10 - الوفاة، وفى هذه الحالة يُصرف ما يعادل الأجر الكامل لمدة شهرين لمواجهة نفقات الجنازة وذلك للأرمل أو لأرشد الأولاد أو لمن يثبت قيامه بتحمل هذه النفقات. وتبين اللائحة التنفيذية قواعد وإجراءات إنهاء الخدمة لهذه الأسباب.", "reg": "لائحة (168): تعد الموارد البشرية أول كل سنة بيانًا بمن سيبلغون سن ترك الخدمة خلال السنة، وتُعلن الموظف بتاريخ بلوغه السن قبلها بشهرين على الأقل، وتُنهى الخدمة من اليوم التالي لبلوغ السن، وتُسلَّم صورة القرار للموظف ورئيسه المباشر والإدارات المعنية مع حفظ صورة بملف الخدمة بعد التأشير بالتسلم أو الامتناع.\nلوائح (169-173): الاستقالة كتابة، وتثبت الموارد البشرية تاريخ ورودها وتعرضها فورًا على السلطة المختصة بمذكرة تفصيلية عن حالة الموظف؛ ولا تنتهي الخدمة إلا من تاريخ قرار قبولها؛ ويجب البت خلال 30 يومًا وإلا اعتُبرت مقبولة بحكم القانون ما لم تكن معلقة على شرط أو مقترنة بقيد (وفي هذه الحالة لا تنتهي الخدمة إلا إذا تضمن القرار إجابته لطلبه)، ويجوز إرجاء القبول لمصلحة العمل لمدة لا تزيد على 30 يومًا إضافية؛ وعند الموافقة أو الإرجاء (لمصلحة العمل أو لاتخاذ إجراءات تأديبية ضده) تُبلغ الموارد البشرية الموظف فورًا، وتُودع الاستقالة بملف الخدمة بعد التأشير عليها بقرار السلطة؛ ويستمر الموظف في عمله حتى إعلانه بالقبول أو انقضاء الميعاد.\nلائحة (174): الحكم بالإحالة للمعاش أو الفصل يُنهي الخدمة من تاريخ صدور الحكم (أو من تاريخ الوقف إن كان موقوفًا) ولا يُسترد ما صُرف من أجر.\nلوائح (175 لـ 180): تعرض الموارد البشرية الأمر على السلطة المختصة أو من تفوضه لإصدار قرار الإنهاء في الحالات: (175) فقد الجنسية المصرية أو انتفاء شرط المعاملة بالمثل (من تاريخه، وما تقاضاه حتى إخلاء طرفه يُعتبر أجرًا مقابل عمل)، (176) الانقطاع بدون إذن 15 يومًا متصلة دون تقديم ما يثبت العذر المقبول خلال الـ15 يومًا التالية، أو 30 يومًا غير متصلة في السنة ولو عوقب تأديبيًا (من تاريخ الانقطاع المتصل أو اليوم التالي لاكتمال غير المتصل)، (177) عدم اللياقة صحيًا بقرار المجلس الطبي (ولا إنهاء قبل نفاد الإجازات المرضية والاعتيادية إلا بطلبه، وتنتهي الخدمة في كل الأحوال لإدمان المخدرات)، (178) الالتحاق بخدمة جهة أجنبية بغير ترخيص من حكومة مصر (من تاريخ الالتحاق)، (179) حكم نهائي بعقوبة جناية أو مقيدة للحرية في جريمة مخلة بالشرف أو الأمانة أو تفقده الثقة والاعتبار، (180) الوفاة (من تاريخ وفاته).", "ex": "غيبت 15 يوم متواصل، بتنتهي خدمتك.", "test": {"q": "إذا تغيب الموظف عن العمل بدون إذن لمدة 15 يوماً متتالية، ماذا يحدث؟", "a": ["يخصم منه", "تنتهي خدمته", "ينقل"], "c": 1}}, {"id": "70", "title": "المعاش المبكر", "sim": "لو عديت 50 سنة ممكن تطلب معاش مبكر.", "text": "لمن جاوز 50 ما لم تُتخذ ضده إجراءات تأديبية.", "full": "للموظف الذي جاوز سن الخمسين أن يطلب إحالته للمعاش المبكر ما لم يكن قد اتخذت ضده إجراءات تأديبية، ويتعين على الوحدة الاستجابة لهذا الطلب وفقًا لما تحدده اللائحة التنفيذية، وفى هذه الحالة تُسوى حقوقه التأمينية على النحو الآتى: 1 - إذا لم يكن قد جاوز سن الخامسة والخمسين وجاوزت مدة اشتراكه في نظام التأمين الاجتماعى عشرين عامًا ومضى على شغله الوظيفة أكثر من سنة، فيعتبر مُرقى إلى الوظيفة التالية لوظيفته من اليوم السابق على تاريخ إحالته للمعاش وتُسوى حقوقه التأمينية بعد ترقيته على أساس مدة اشتراكه في نظام التأمين الاجتماعى مضافًا إليها خمس سنوات. 2 - إذا كان قد جاوز سن الخامسة والخمسين وجاوزت مدة اشتراكه في التأمينات الاجتماعية عشرين عامًا، فتُسوى حقوقه التأمينية على أساس مدة اشتراكه في التأمينات الاجتماعية مضافًا إليها المدة الباقية لبلوغه السن المقررة لانتهاء الخدمة أو خمس سنوات أيهما أقل. ولا يجوز تعيين من يُحال للمعاش المبكر وفقًا لأحكام هذه المادة في أى من الوحدات الخاضعة لأحكام هذا القانون.", "reg": "لائحة (181): تُثبَّت على الطلب تاريخ وروده ويُعرض فورًا على السلطة المختصة بمذكرة تفصيلية عن حالة الموظف.\nلائحة (182): يجب البت في الطلب خلال 30 يومًا من تقديمه وإلا اعتُبر مقبولًا بحكم القانون.\nلائحة (183): للسلطة المختصة إخطار الموظف بإرجاء النظر في الطلب لمدة لا تزيد على 3 أشهر من اليوم التالي للإخطار، لحين وضع خطة لضمان استمرارية الأعمال، على أن تُرسل الخطة إلى إدارة الموارد البشرية.\nلائحة (184): يستمر الموظف في عمله إلى أن يُعلن بقرار القبول أو ينقضي الميعادان.\nلائحة (185): يُشترط أن تكون مدة الاشتراك في التأمينات الاجتماعية 20 سنة فعلية.", "ex": "عندك 52 سنة ومدة اشتراكك 20 سنة فعلية، ممكن تطلب معاش مبكر.", "test": {"q": "ما هو السن الأدنى لطلب المعاش المبكر؟", "a": ["45 سنة", "50 سنة", "55 سنة"], "c": 1}}, {"id": "71", "title": "بدل رصيد الإجازات", "sim": "الإجازات القديمة اللي ماخدتهاش بتاخد فلوسها.", "text": "مقابل نقدي عن رصيد الاعتيادية المتكون قبل العمل بالقانون.", "full": "يستحق الموظف عند انتهاء خدمته مقابلًا عن رصيد إجازاته الاعتيادية الذي تكوَّن قبل العمل بأحكام هذا القانون ولم يستنفدها قبل انتهاء خدمته. ويحسب المقابل النقدى على أساس الأجر الأساسى مضافًا إليه العلاوات الخاصة التي كان يتقاضاها حتى تاريخ العمل بهذا القانون.", "reg": "لائحة (186): يستحق الموظف عند انتهاء خدمته مقابلًا عن رصيد إجازاته الاعتيادية الذي تكوَّن قبل العمل بالقانون ولم يستنفذه، ويُحسب المقابل النقدي على أساس الأجر الأساسي مضافًا إليه العلاوات الخاصة التي كان يتقاضاها حتى تاريخ العمل بالقانون. وتعد الموارد البشرية بيانًا تفصيليًا من ملف خدمة الموظف وسجل إجازاته يحدد رصيد الإجازات المتبقي وقيمة المقابل النقدي، ويعتمده السلطة المختصة خلال 15 يومًا من إعداده ويُرسل للإدارات المعنية للتنفيذ، وتُسلم صورة منه للموظف مرفقًا بها إخطار بمواعيد الصرف. ويُصرف المقابل وفقًا لنظام يصدر بقرار من وزير المالية.\nلائحة (192): يستحق الموظف نصف رصيد الإجازات الاعتيادية والعارضة وفق القواعد المقررة قبل القانون عن الفترة من 2017/1/1 حتى 2017/6/30، ويُجبر الكسر لصالح الموظف.", "ex": "عندك رصيد قديم، بتاخد قيمته فلوس.", "test": {"q": "هل يستحق الموظف مقابل نقدي عن رصيد إجازاته القديم عند انتهاء الخدمة؟", "a": ["نعم", "لا", "لا يستحق إلا بحكم قضائي"], "c": 0}}, {"id": "72", "title": "كبار الموظفين", "sim": "اللي شاغل وظيفة (كبير) بيحتفظ بيها بصفة شخصية لحد ما تنتهي مدة شغله ليها أو يبلغ سن التقاعد، أيهما أقرب.", "text": "يحتفظ شاغلو وظيفة كبير بوظائفهم شخصيًا إلى حين انتهاء مدة شغلهم لها أو بلوغ سن التقاعد أيهما أقرب.", "full": "يحتفظ شاغلو وظيفة كبير بوظائفهم بصفة شخصية إلى حين انتهاء مدة شغلهم لها أو بلوغ سن التقاعد أيهما أقرب.", "reg": "لا توجد مادة مقابلة مباشرة. ومن الأحكام الانتقالية في اللائحة:\nلائحة (193): تسري أحكام اللائحة على مدد شغل الوظائف القيادية والندب والإعارات والإجازات بدون أجر المرخص بها بعد العمل بالقانون.\nلائحة (194): تُحسب للمعيَّن قبل العمل بالقانون مدد الخبرة العلمية والعملية وفقًا للشروط والقواعد المقررة قبل العمل بأحكامه.", "ex": "كبير أخصائيين باقي على سن تقاعده سنة وعلى مدة شغله للوظيفة 3 سنين، بيحتفظ بيها سنة بس (الأقرب).", "test": {"q": "إلى متى يحتفظ شاغلو وظيفة 'كبير' بوظائفهم بصفة شخصية؟", "a": ["حتى انتهاء مدة شغلهم أو بلوغ سن التقاعد أيهما أقرب", "حتى الوفاة دائمًا", "لمدة سنة واحدة فقط"], "c": 0}}, {"id": "73", "title": "الأجور الموسمية", "sim": "اللي اشتغل موسمي 3 سنين قبل 2016، بيتعين دائم.", "text": "يُعين على أدنى درجات الباب الأول من قضى 3 سنوات على
